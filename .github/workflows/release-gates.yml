name: release-gates

# Reusable composite gate workflow. Called as a prereq from each surface
# release workflow (electron-release, docker-release, mcp-release, lib-release).
# Reads the consumer's release-config.yml to decide which gates run.
# Any failure aborts the release.

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ''
        description: Runner label for gate jobs.
      node_version:
        type: string
        default: '20'
        description: Node version for tests + npm-audit.
    outputs:
      version:
        description: Version asserted to match the pushed tag.
        value: ${{ jobs.tag-matches-version.outputs.version }}

permissions:
  contents: read

jobs:
  read-config:
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    outputs:
      project: ${{ steps.parse.outputs.project }}
      surface: ${{ steps.parse.outputs.surface }}
      tests_enabled: ${{ steps.parse.outputs.tests_enabled }}
      test_command: ${{ steps.parse.outputs.test_command }}
      gitleaks_enabled: ${{ steps.parse.outputs.gitleaks_enabled }}
      size_guard_enabled: ${{ steps.parse.outputs.size_guard_enabled }}
      npm_audit_severity: ${{ steps.parse.outputs.npm_audit_severity }}
      conventional_commits_enabled: ${{ steps.parse.outputs.conventional_commits_enabled }}
      independence: ${{ steps.parse.outputs.independence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse release-config.yml
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f release-config.yml ]; then
            echo "::error::release-config.yml not found at repo root."
            exit 1
          fi
          # yq is preinstalled on ubuntu-latest runners.
          # Read each value, default to a literal default when the key is null
          # (yq's `// default` returns the literal "null" string for missing
          # keys, not the default — we handle that explicitly here so a key
          # set to `false` doesn't get coerced to the default `true`).
          read_with_default() {
            local path="$1" default="$2" val
            val=$(yq "$path" release-config.yml)
            if [ "$val" = "null" ] || [ -z "$val" ]; then
              echo "$default"
            else
              echo "$val"
            fi
          }
          project=$(read_with_default '.project' 'unknown')
          surface=$(read_with_default '.surface' '')
          tests_enabled=$(read_with_default '.gates.tests' 'true')
          test_command=$(read_with_default '.gates.test_command' 'npm test')
          gitleaks_enabled=$(read_with_default '.gates.gitleaks' 'true')
          size_guard_enabled=$(read_with_default '.gates.size_guard' 'true')
          npm_audit_severity=$(read_with_default '.gates.npm_audit' 'high')
          conventional_commits_enabled=$(read_with_default '.gates.conventional_commits' 'false')
          # STANDARDS §13.2: full | tooling | harness. Absent means full. An
          # unknown value is an error, never a wider exemption.
          independence=$(read_with_default '.independence' 'full')
          case "$independence" in
            full|tooling|harness) ;;
            *) echo "::error::release-config.yml independence: '$independence' is not one of full, tooling, harness"; exit 1 ;;
          esac

          if [ -z "$surface" ]; then
            echo "::error::release-config.yml missing required field: surface"
            exit 1
          fi

          {
            echo "project=$project"
            echo "surface=$surface"
            echo "tests_enabled=$tests_enabled"
            echo "test_command=$test_command"
            echo "gitleaks_enabled=$gitleaks_enabled"
            echo "size_guard_enabled=$size_guard_enabled"
            echo "npm_audit_severity=$npm_audit_severity"
            echo "conventional_commits_enabled=$conventional_commits_enabled"
            echo "independence=$independence"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## release-gates configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| project | ${{ steps.parse.outputs.project }} |"
            echo "| surface | ${{ steps.parse.outputs.surface }} |"
            echo "| tests | ${{ steps.parse.outputs.tests_enabled }} (\`${{ steps.parse.outputs.test_command }}\`) |"
            echo "| gitleaks | ${{ steps.parse.outputs.gitleaks_enabled }} |"
            echo "| size_guard | ${{ steps.parse.outputs.size_guard_enabled }} |"
            echo "| npm_audit | ${{ steps.parse.outputs.npm_audit_severity }} |"
            echo "| conventional_commits | ${{ steps.parse.outputs.conventional_commits_enabled }} |"
            echo "| independence | ${{ steps.parse.outputs.independence }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: read-config
    if: needs.read-config.outputs.tests_enabled == 'true'
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain per surface (release/SPEC.md "Pre-release gates"): Node when
      # the repo has package.json, Rust when it has Cargo.toml, both when it
      # has both, neither otherwise (test_command then runs on the runner's
      # own tools). Before 2026-11-03 the Node steps were unconditional and a
      # Cargo-only repo failed at setup-node ("Dependencies lock file is not
      # found"; steward-governance v0.1.0, run 41692008392).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('package.json') != ''
        with:
          node-version: ${{ inputs.node_version }}
          # No Actions cache in a release path (audit 2026-10-27, R-C).
          package-manager-cache: false
      - run: npm ci
        if: hashFiles('package.json') != ''
      # The nexus-ci golden image carries no Rust toolchain (infra Inbox
      # d8620c58). rustup-init is fetched by version and verified against its
      # published SHA-256 before it runs; the toolchain version comes from the
      # consumer's committed rust-toolchain.toml (refused when absent: a
      # release must not float on whatever "stable" means today). No cache of
      # any kind (SC-52).
      - name: Install the pinned Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        shell: bash
        env:
          RUSTUP_VERSION: "1.29.2"
          RUSTUP_INIT_SHA256: "5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4"
        run: |
          set -euo pipefail
          if [ ! -f rust-toolchain.toml ]; then
            echo "::error::Cargo.toml present but no rust-toolchain.toml: commit one with [toolchain] channel = \"<exact version>\" (release/SPEC.md)"
            exit 1
          fi
          RUST_TOOLCHAIN=$(yq '.toolchain.channel // ""' -p toml rust-toolchain.toml)
          if ! [[ "$RUST_TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rust-toolchain.toml channel must be an exact version (got '${RUST_TOOLCHAIN}')"
            exit 1
          fi
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init" \
            -o /tmp/rustup-init
          echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod 0755 /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal \
            --default-toolchain "${RUST_TOOLCHAIN}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version
      - name: Run tests
        run: ${{ needs.read-config.outputs.test_command }}

  gitleaks:
    needs: read-config
    if: needs.read-config.outputs.gitleaks_enabled == 'true'
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # Pinned version AND pinned SHA-256 (work item 67dbdbfb). The nexus-ci
          # golden image bakes this exact release (infra ci-vm/image/user-data.yaml),
          # so on nexus-ci nothing is downloaded; a hosted runner (public repo)
          # downloads the archive to a file and verifies it BEFORE anything in it
          # is extracted. The checksum is pinned here, not fetched from the same
          # origin as the archive. A different baked version fails closed.
          GL_VERSION=8.18.4
          GL_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          if command -v gitleaks >/dev/null 2>&1; then
            have=$(gitleaks version 2>/dev/null | tr -d '[:space:]' | sed 's/^v//')
            if [ "$have" = "$GL_VERSION" ]; then
              echo "gitleaks ${GL_VERSION} is baked into the runner image; nothing downloaded"
              gitleaks version
              exit 0
            fi
            echo "runner has gitleaks ${have}, pinned ${GL_VERSION}: refusing to use it" >&2
            exit 1
          fi
          T="${RUNNER_TEMP:-/tmp}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$T" "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  ${T}" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "$T" gitleaks
          rm -f "$T"
          gitleaks version

      - name: Scan tagged commit
        shell: bash
        run: |
          set -euo pipefail
          # Scan from the start of the new commits introduced since the previous tag.
          # If no previous tag exists, scan full history (initial release).
          if PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
            echo "scanning ${PREV_TAG}..HEAD"
            gitleaks detect --no-banner --redact --log-opts="${PREV_TAG}..HEAD"
          else
            echo "no previous tag — scanning full history"
            gitleaks detect --no-banner --redact
          fi

  size-guard:
    needs: read-config
    if: needs.read-config.outputs.size_guard_enabled == 'true'
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject tracked files larger than 10 MB
        shell: bash
        run: |
          set -euo pipefail
          MAX=$((10 * 1024 * 1024))
          violations=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            allow=0
            if [ -f ".large-files-allowlist" ]; then
              while IFS= read -r pat; do
                [[ "$pat" =~ ^[[:space:]]*# || -z "$pat" ]] && continue
                if [[ "$f" == $pat || "$f" == ${pat%/}/* ]]; then allow=1; break; fi
              done <".large-files-allowlist"
            fi
            [ "$allow" -eq 1 ] && continue
            size=$(wc -c <"$f" 2>/dev/null || echo 0)
            if [ "$size" -gt "$MAX" ]; then
              violations+=$'\n'"  $f ($((size / 1024 / 1024)) MB)"
            fi
          done < <(git ls-files)
          if [ -n "$violations" ]; then
            echo "::error::Tracked files exceed 10 MB:$violations"
            exit 1
          fi

  # npm audit over EVERY npm manifest in the tree, not just the root.
  # Until 2026-11-16 this job ran `[ -f package.json ] || exit 0` at the repo
  # root, so a repo whose manifest lives in a subdirectory (Keystone:
  # frontend/package.json) shipped with `npm_audit: high` having examined
  # nothing (audit-keystone-2026-11-16, brain ac517cd7; the ai-console shape
  # security-audit.yml fixed for SC-26). Contract now:
  # - detection is the shared block, byte-identical in security-audit.yml and
  #   dep-auto-apply.yml (scripts/tests/test_release_gates_workflow.py):
  #   tracked manifests only, never node_modules, workspace members folded
  #   into the root whose lockfile names them;
  # - an enabled gate that finds no manifest FAILS. A repo with no npm
  #   dependencies declares it with `gates.npm_audit: off` in release-config.yml;
  # - every detected directory must be examined: an npm lockfile is first
  #   proven in sync with its manifest and every folded workspace member
  #   (`npm ci --dry-run`, the frozen check the shared block's comment relies
  #   on), then gets `npm audit --package-lock-only` at the configured level;
  #   a manifest declaring no dependencies is examined
  #   and clean; anything else (dependencies without a lockfile, a pnpm or yarn
  #   lockfile this npm-only gate cannot read, an unreadable package.json) is
  #   NOT EXAMINED and fails;
  # - advisory exceptions (incident ab044000: picomatch GHSA-fc5q-39xc-vjpf,
  #   HIGH, no patched version) come only from `.github/npm-audit-exceptions.json`
  #   through the `shared npm audit exceptions` block, byte-identical in
  #   security-audit.yml (scripts/tests/test_npm_audit_exceptions.py): GHSA id,
  #   reason, expiry at most 180 days out, optional dirs; an expired or invalid
  #   entry fails, and every exception honoured is a ::warning:: and a summary
  #   row. The level itself is never lowered.
  npm-audit:
    needs: read-config
    if: needs.read-config.outputs.npm_audit_severity != 'off'
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    env:
      # Config values reach scripts through env, never `${{ }}` in run:.
      NPM_AUDIT_LEVEL: ${{ needs.read-config.outputs.npm_audit_severity }}
      # npm audit runs no lifecycle script; pinned off anyway (env beats .npmrc).
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect npm manifests
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          case "${NPM_AUDIT_LEVEL:-}" in
            info|low|moderate|high|critical) ;;
            *) echo "::error::release-config.yml gates.npm_audit: '${NPM_AUDIT_LEVEL:-}' is not one of off, info, low, moderate, high, critical"; exit 1 ;;
          esac
          # >>> shared manifest detection: byte-identical in security-audit.yml and
          # dep-auto-apply.yml (scripts/tests/test_dep_auto_apply_workflow.py).
          # Change both or neither.
          # Directories (repo-relative, "." for the root) that hold a tracked
          # manifest matching the pathspecs, as a JSON array.
          # The filtering is done in python, not grep: under pipefail an empty
          # grep exits 1 and would kill this step for every repo that lacks
          # one of the ecosystems.
          dirs_of() {
            git ls-files -z -- "$@" | python3 -I -c '
          import json, posixpath, sys
          paths = [p for p in sys.stdin.buffer.read().decode().split("\0") if p]
          # A directory name is repo content a PR controls. A control character
          # (a newline above all) could forge a `::command::` line when a later
          # step echoes it, so refuse, never pass it on.
          hostile = [p for p in paths if any(ord(c) < 0x20 or ord(c) == 0x7f for c in p)]
          if hostile:
              sys.exit("control character in manifest path(s): " + ", ".join(repr(p) for p in hostile))
          keep = sorted({posixpath.dirname(p) or "." for p in paths
                         if "node_modules" not in p.split("/")})
          print(json.dumps(keep))'
          }
          npm_manifest_dirs=$(dirs_of 'package.json' '**/package.json')
          # Workspace members are audited once, through the root that declares
          # them. A member of a pnpm / npm / yarn workspace has no lockfile of
          # its own: the ROOT's lockfile resolves it. Given a job of its own,
          # the member ran `npm install` and died on `workspace:*`
          # (EUNSUPPORTEDPROTOCOL), red for a reason that is not a finding
          # (openclaw-1, 36 such jobs; shared-brain discovery 54c58aa3). A
          # directory is folded into its root only when all of these hold:
          # - it has no lockfile of its own;
          # - an ancestor directory holds a tracked lockfile and declares it a
          #   member: pnpm-workspace.yaml `packages:` when that lockfile is
          #   pnpm-lock.yaml (pnpm ignores package.json `workspaces`), else
          #   package.json `workspaces` (an array, or the `packages` key of an
          #   object), `!` patterns excluding;
          # - that lockfile names it (a pnpm importer, a package-lock.json
          #   `packages` key, a yarn berry `@workspace:` locator). yarn classic
          #   records no workspaces in yarn.lock, so nothing proves membership
          #   and its members are NEVER folded: each keeps its own job (audit
          #   2026-10-27: a glob alone folded a dot-directory yarn never sees).
          # Globs follow the package managers' own (minimatch / fast-glob,
          # dot: false): `*`, `?` and `**` never match a path segment that
          # starts with a dot; only a literal leading dot does.
          # The nearest such ancestor wins. Anything not provably covered keeps
          # its own job, which fails loudly rather than vanishing. The root's
          # frozen install checks every member manifest against the lockfile
          # and its audit reads the whole lockfile, so the root job's result is
          # each member's result; the summary lists which root covered which
          # member, and a member is clean only if that root's job succeeded.
          ws_files=$(mktemp)
          git ls-files -z -- \
            'pnpm-lock.yaml' '**/pnpm-lock.yaml' 'pnpm-workspace.yaml' '**/pnpm-workspace.yaml' \
            'yarn.lock' '**/yarn.lock' 'package-lock.json' '**/package-lock.json' \
            'npm-shrinkwrap.json' '**/npm-shrinkwrap.json' > "$ws_files"
          # A file, not $(...): bash mis-parses a quote-heavy heredoc inside a
          # command substitution. set -e still stops the step if python fails.
          ws_split=$(mktemp)
          python3 -I - "$npm_manifest_dirs" "$ws_files" > "$ws_split" <<'PY'
          import json, re, sys
          manifest_dirs = json.loads(sys.argv[1])
          with open(sys.argv[2], "rb") as fh:
              tracked = {p for p in fh.read().decode().split("\0") if p}
          LOCKS = ("pnpm-lock.yaml", "yarn.lock", "package-lock.json", "npm-shrinkwrap.json")
          notes = []

          def at(d, name):
              return name if d == "." else d + "/" + name

          def has(d, name):
              return at(d, name) in tracked

          def read(d, name):
              with open(at(d, name), encoding="utf-8", errors="replace") as fh:
                  return fh.read()

          def scalar(s):
              # One YAML scalar: quoted, or plain up to a ` #` comment.
              s = s.strip()
              if s[:1] in ("'", '"'):
                  end = s.find(s[0], 1)
                  return s[1:end] if end > 0 else None
              return re.split(r"\s+#", s, maxsplit=1)[0].strip()

          def pnpm_globs(text):
              # The top-level `packages:` sequence, block or flow form. Any
              # other shape returns None: unreadable, so nothing is folded.
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  m = re.match(r"packages\s*:(.*)$", line)
                  if not m:
                      continue
                  rest = re.split(r"\s+#", m.group(1), maxsplit=1)[0].strip()
                  if rest.startswith("[") and rest.endswith("]"):
                      items = [x for x in rest[1:-1].split(",") if x.strip()]
                  elif rest:
                      return None
                  else:
                      items = []
                      for l in lines[i + 1:]:
                          s = l.strip()
                          if not s or s.startswith("#"):
                              continue
                          if not s.startswith("-"):
                              if l[0].isspace():
                                  return None
                              break
                          items.append(s[1:])
                  out = [scalar(x) for x in items]
                  return None if any(x is None for x in out) else out
              # No `packages:` key: a settings-only file (onlyBuiltDependencies
              # and the like) for a single-project workspace. No members.
              return []

          def glob_re(pat):
              # Per segment, so a wildcard can never match a dot segment.
              segs, rx = pat.split("/"), ""
              for n, seg in enumerate(segs):
                  last = n == len(segs) - 1
                  if seg == "**":
                      rx += r"(?!\.)[^/]+(?:/(?!\.)[^/]+)*" if last else r"(?:(?!\.)[^/]+/)*"
                      continue
                  if seg in ("", ".", ".."):
                      return None
                  part = "" if seg.startswith(".") else r"(?!\.)"
                  for ch in seg:
                      if ch == "*":
                          part += "[^/]*"
                      elif ch == "?":
                          part += "[^/]"
                      elif ch in "[]{}()!+@":
                          return None
                      else:
                          part += re.escape(ch)
                  rx += part + ("" if last else "/")
              return re.compile(rx + r"\Z")

          def matcher(globs):
              pos, neg = [], []
              for g in globs:
                  if not isinstance(g, str):
                      return None
                  bucket = neg if g.startswith("!") else pos
                  g = g[1:] if g.startswith("!") else g
                  while g.startswith("./"):
                      g = g[2:]
                  g = g.rstrip("/")
                  rx = glob_re(g)
                  if rx is None:
                      if bucket is neg:
                          return None   # an exclusion we cannot read: nothing is provably a member
                      continue          # an inclusion we cannot read claims nothing
                  bucket.append(rx)
              return lambda rel: any(r.match(rel) for r in pos) and not any(r.match(rel) for r in neg)

          def lock_names(d):
              # The root's lockfile, in the order the install step picks it.
              if has(d, "pnpm-lock.yaml"):
                  keys, inside = set(), False
                  for line in read(d, "pnpm-lock.yaml").splitlines():
                      if not line.strip():
                          continue
                      if not line[0].isspace():
                          inside = line.rstrip() == "importers:"
                          continue
                      # An importer key: exactly two spaces in, `key:` then a
                      # newline or a value (`ui: {}`); quotes are stripped.
                      m = re.match(r"  (\S[^:]*):(?:\s|$)", line) if inside else None
                      if m:
                          keys.add(scalar(m.group(1)))
                  return lambda rel: rel in keys
              if has(d, "yarn.lock"):
                  text = read(d, "yarn.lock")
                  if not re.search(r"^__metadata:", text, re.M):
                      return None   # yarn classic records no workspaces: never fold
                  return lambda rel: re.search("@workspace:" + re.escape(rel) + r'(?=[",:\s])', text) is not None
              for name in ("package-lock.json", "npm-shrinkwrap.json"):
                  if has(d, name):
                      try:
                          pkgs = json.loads(read(d, name)).get("packages")
                      except (ValueError, AttributeError):
                          pkgs = None
                      keys = set(pkgs) if isinstance(pkgs, dict) else set()
                      return lambda rel: rel in keys
              return None

          def declared(d):
              if has(d, "pnpm-lock.yaml"):
                  if not has(d, "pnpm-workspace.yaml"):
                      return None
                  where = at(d, "pnpm-workspace.yaml")
                  globs = pnpm_globs(read(d, "pnpm-workspace.yaml"))
              else:
                  where = at(d, "package.json") + " workspaces"
                  try:
                      ws = json.loads(read(d, "package.json")).get("workspaces")
                  except (ValueError, AttributeError):
                      notes.append(f"{at(d, 'package.json')} is not a JSON object; no member of {d} is folded into it")
                      return None
                  if ws is None:
                      return None
                  globs = ws.get("packages") if isinstance(ws, dict) else ws
                  if not isinstance(globs, list):
                      globs = None
              m = matcher(globs) if globs is not None else None
              if m is None:
                  notes.append(f"{where} could not be read; no member of {d} is folded into it")
              return m

          roots = {}
          for d in manifest_dirs:
              if any(has(d, n) for n in LOCKS):
                  m = declared(d)
                  if m is not None:
                      roots[d] = (m, lock_names(d))
          nearest_first = sorted(roots, key=lambda r: (r != ".", r.count("/"), len(r)), reverse=True)
          audit, covered = [], {}
          for d in manifest_dirs:
              if d not in roots and not any(has(d, n) for n in LOCKS):
                  for r in nearest_first:
                      if r == d or (r != "." and not d.startswith(r + "/")):
                          continue
                      rel = d if r == "." else d[len(r) + 1:]
                      claims, listed = roots[r]
                      if not claims(rel):
                          continue
                      if listed is None or not listed(rel):
                          notes.append(f"{d} matches the workspace globs of {r} but that lockfile has no entry for it; audited on its own")
                          break
                      covered[d] = r
                      break
              if d not in covered:
                  audit.append(d)
          print(json.dumps(audit))
          print(json.dumps(covered, sort_keys=True))
          for n in notes:
              print(n)
          PY
          npm_dirs=$(sed -n 1p "$ws_split")
          npm_covered=$(sed -n 2p "$ws_split")
          while IFS= read -r note; do
            echo "::warning::workspace: $note"
          done < <(sed -n '3,$p' "$ws_split")
          rm -f "$ws_files" "$ws_split"
          go_dirs=$(dirs_of 'go.mod' '**/go.mod')
          python_dirs=$(dirs_of 'pyproject.toml' '**/pyproject.toml' 'requirements*.txt' '**/requirements*.txt')
          # <<< shared manifest detection
          state="${RUNNER_TEMP:-/tmp}"
          printf '%s\n' "$npm_dirs" > "$state/npm-dirs.json"
          printf '%s\n' "$npm_covered" > "$state/npm-covered.json"
          n_npm=$(python3 -I -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$npm_dirs")
          if [ "$n_npm" -eq 0 ]; then
            echo "::error::gates.npm_audit is '$NPM_AUDIT_LEVEL' but no tracked package.json exists anywhere in the tree, so nothing was audited. If this repo has no npm dependencies, set gates.npm_audit: off in release-config.yml."
            exit 1
          fi
          echo "::notice::npm audit roots: $npm_dirs"
          echo "::notice::npm workspace members audited through their root (member: root): $npm_covered"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: Run npm audit on every manifest
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          # >>> shared npm audit exceptions: byte-identical in release-gates.yml,
          # security-audit.yml and templates/.github/workflows/security-audit.yml
          # (scripts/tests/test_npm_audit_exceptions.py). Change all three or none.
          # npm_audit_gate ROOT DIR LEVEL [npm audit args...] runs
          # `npm audit --json --audit-level=LEVEL` in ROOT/DIR and returns 1 on any
          # vulnerability at or above LEVEL that ROOT/.github/npm-audit-exceptions.json
          # does not excuse. npm has no ignore list of its own (peers: pnpm
          # auditConfig.ignoreGhsas, cargo-audit [advisories] ignore, pip-audit
          # --ignore-vuln, audit-ci allowlist); this is that list, one file per repo:
          #   {"exceptions": [{"ghsa": "GHSA-xxxx-xxxx-xxxx", "reason": "...",
          #                    "expires": "YYYY-MM-DD", "dirs": ["frontend"]}]}
          # - Advisory ids come from the audit report (`via[].url`), never from a
          #   package.json or .npmrc, so nothing here steers what is audited.
          # - A vulnerable package is excused only when EVERY advisory at or above
          #   LEVEL that reaches it (via strings followed to their root advisories) is
          #   listed; anything else fails exactly as a plain `npm audit` would.
          # - The file is PR-controlled, so it is loud: each exception honoured is a
          #   ::warning:: and a step-summary row (id, reason, expiry, packages), and one
          #   that excused nothing is a ::notice:: (stale).
          # - Fail closed: an unreadable or malformed file, an unknown key, a duplicate
          #   id, a bad id, an empty reason or a bad date is NOT EXAMINED; an exception
          #   past its `expires` date (UTC), or expiring more than 180 days out, fails.
          #   A missing report, an npm error, or a report that disagrees with npm's
          #   exit code is NOT EXAMINED.
          npm_audit_gate() {
            local root="$1" dir="$2" level="$3" report rc=0 verdict=0
            shift 3
            report="$(mktemp)"
            ( cd -- "$root/$dir" && npm audit --json --audit-level="$level" "$@" < /dev/null ) > "$report" || rc=$?
            python3 -I - "$report" "$rc" "$root" "$dir" "$level" <<'PY' || verdict=$?
          import datetime, html, json, os, re, sys
          report_path, npm_rc, root, audit_dir, level = sys.argv[1:6]
          NAME = ".github/npm-audit-exceptions.json"
          LEVELS = ("info", "low", "moderate", "high", "critical")
          RANK = {s: i for i, s in enumerate(LEVELS)}
          GHSA = re.compile(r"GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}")
          URL = re.compile(r"https://github\.com/advisories/(GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4})")
          DATE = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}")
          SEGMENT = re.compile(r"[A-Za-z0-9._@+-]+")
          MAX_DAYS = 180
          today = datetime.datetime.now(datetime.timezone.utc).date()

          def cmd(s):
              # Workflow-command data: a newline in PR-controlled text must not start a new command.
              return str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def md(s):
              return html.escape(" ".join(str(s).split()), quote=False).replace("|", "\\|").replace("`", "'")

          def summary(lines):
              with open(os.environ.get("GITHUB_STEP_SUMMARY") or os.devnull, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          def not_examined(why):
              print(f"::error::not examined: npm audit in {cmd(audit_dir)}: {cmd(why)}")
              summary([f"- npm audit `{md(audit_dir)}`: **NOT EXAMINED**: {md(why)}"])
              sys.exit(1)

          def norm_dir(d):
              if not d:
                  return None
              while d.startswith("./"):
                  d = d[2:]
              parts = [] if d in ("", ".") else d.rstrip("/").split("/")
              if d.startswith("/") or any(p in ("", ".", "..") or not SEGMENT.fullmatch(p) for p in parts):
                  return None
              return "/".join(parts) or "."

          def unique_keys(pairs):
              keys = [k for k, _ in pairs]
              if len(keys) != len(set(keys)):
                  raise ValueError("duplicate key")
              return dict(pairs)

          here = norm_dir(audit_dir)
          if here is None:
              not_examined(f"audit directory {audit_dir!r} is not a plain relative path")
          if level not in RANK:
              not_examined(f"audit level {level!r} is not one of {', '.join(LEVELS)}")
          floor = RANK[level]

          # The exception file.
          errors = []
          exceptions = {}
          listed = set()
          path = os.path.join(root, ".github", "npm-audit-exceptions.json")
          if os.path.lexists(path):
              if os.path.islink(path) or not os.path.isfile(path) or \
                      not os.path.realpath(path).startswith(os.path.realpath(root) + os.sep):
                  not_examined(f"{NAME} is not a regular file inside the checkout")
              with open(path, "rb") as fh:
                  raw = fh.read(65537)
              if len(raw) > 65536:
                  not_examined(f"{NAME} is larger than 64 KiB")
              try:
                  doc = json.loads(raw.decode("utf-8"), object_pairs_hook=unique_keys)
              except (UnicodeDecodeError, ValueError) as exc:
                  not_examined(f"{NAME} is not valid JSON with unique keys ({exc.__class__.__name__}), so none of its exceptions can be read")
              if not isinstance(doc, dict) or set(doc) != {"exceptions"} or not isinstance(doc["exceptions"], list):
                  not_examined(f'{NAME} must be an object whose only key is "exceptions", a list')
              if len(doc["exceptions"]) > 200:
                  not_examined(f"{NAME} lists more than 200 exceptions")
              for i, e in enumerate(doc["exceptions"]):
                  at = f"{NAME} exceptions[{i}]"
                  if not isinstance(e, dict):
                      not_examined(f"{at} is not an object")
                  if set(e) - {"ghsa", "reason", "expires", "dirs"} or not {"ghsa", "reason", "expires"} <= set(e):
                      not_examined(f"{at} must have ghsa, reason and expires, optionally dirs, and nothing else (has {sorted(e)})")
                  ghsa, reason, expires = e["ghsa"], e["reason"], e["expires"]
                  if not isinstance(ghsa, str) or not GHSA.fullmatch(ghsa):
                      not_examined(f"{at}.ghsa {ghsa!r} is not a GHSA-xxxx-xxxx-xxxx id (lower case after GHSA-, as in the advisory URL)")
                  if ghsa in listed:
                      not_examined(f"{at}.ghsa {ghsa} is listed twice")
                  listed.add(ghsa)
                  if not isinstance(reason, str) or not reason.strip() or len(reason) > 500 or \
                          any(ord(c) < 32 or ord(c) == 127 for c in reason):
                      not_examined(f"{at}.reason must be a non-empty single line of at most 500 characters")
                  try:
                      if not isinstance(expires, str) or not DATE.fullmatch(expires):
                          raise ValueError(expires)
                      until = datetime.date.fromisoformat(expires)
                  except ValueError:
                      not_examined(f"{at}.expires {expires!r} is not a YYYY-MM-DD date")
                  dirs = None
                  if "dirs" in e:
                      if not isinstance(e["dirs"], list) or not e["dirs"] or not all(isinstance(d, str) for d in e["dirs"]):
                          not_examined(f"{at}.dirs must be a non-empty list of repo-relative directories")
                      dirs = [norm_dir(d) for d in e["dirs"]]
                      if None in dirs or len(set(dirs)) != len(dirs):
                          not_examined(f"{at}.dirs holds a path that is not a plain relative directory, or a duplicate")
                  if until < today:
                      errors.append(f"npm audit exception {ghsa} expired on {expires} (UTC); fix the dependency, or renew the exception with a new expiry and reason")
                  elif (until - today).days > MAX_DAYS:
                      errors.append(f"npm audit exception {ghsa} expires {expires}, more than {MAX_DAYS} days out; a risk acceptance is re-decided at least every {MAX_DAYS} days")
                  elif dirs is None or here in dirs:
                      exceptions[ghsa] = {"reason": reason, "expires": expires, "covers": set()}

          # The audit report.
          try:
              with open(report_path, encoding="utf-8") as fh:
                  rep = json.load(fh)
          except (OSError, UnicodeDecodeError, ValueError):
              not_examined(f"npm audit (exit {npm_rc}) wrote no JSON report")
          if not isinstance(rep, dict):
              not_examined("the npm audit report is not a JSON object")
          if "error" in rep:
              err = rep["error"] if isinstance(rep["error"], dict) else {}
              not_examined(f"npm audit could not run (exit {npm_rc}): {err.get('code', '?')}: {err.get('summary', rep['error'])}")
          vulns = rep.get("vulnerabilities")
          if rep.get("auditReportVersion") != 2 or not isinstance(vulns, dict) or npm_rc not in ("0", "1"):
              not_examined(f"unrecognised npm audit report (auditReportVersion {rep.get('auditReportVersion')!r}, exit {npm_rc})")
          for name, v in vulns.items():
              if not isinstance(v, dict) or v.get("severity") not in RANK or not isinstance(v.get("via"), list):
                  not_examined(f"report entry {name!r} has no known severity or via list")

          def advisories(start):
              """Every advisory that reaches `start`; a via string names another report entry."""
              found, seen, stack = {}, set(), [start]
              while stack:
                  name = stack.pop()
                  if name in seen:
                      continue
                  seen.add(name)
                  if name not in vulns:
                      not_examined(f"{start!r} is reached through {name!r}, which the report does not list")
                  for via in vulns[name]["via"]:
                      if isinstance(via, str):
                          stack.append(via)
                          continue
                      if not isinstance(via, dict) or via.get("severity") not in RANK:
                          not_examined(f"report entry {name!r} has an advisory without a known severity")
                      m = URL.fullmatch(via["url"]) if isinstance(via.get("url"), str) else None
                      key = m.group(1) if m else f"advisory source {via.get('source')!r} ({via.get('url')!r})"
                      found[key] = {"ghsa": m.group(1) if m else None, "severity": via["severity"], "title": via.get("title", "")}
              return found

          at_level = sorted(n for n, v in vulns.items() if RANK[v["severity"]] >= floor)
          if (npm_rc == "1") != bool(at_level):
              not_examined(f"npm audit exit {npm_rc} disagrees with its report ({len(at_level)} package(s) at or above {level})")
          failing = []
          for name in at_level:
              reach = {k: a for k, a in advisories(name).items() if RANK[a["severity"]] >= floor}
              if not reach:
                  not_examined(f"{name!r} is {vulns[name]['severity']} but no advisory at or above {level} reaches it")
              unexcused = {k: a for k, a in reach.items() if a["ghsa"] not in exceptions}
              if unexcused:
                  failing.append((name, vulns[name]["severity"], unexcused))
              else:
                  for a in reach.values():
                      exceptions[a["ghsa"]]["covers"].add(name)

          lines = []
          honoured = {g: x for g, x in sorted(exceptions.items()) if x["covers"]}
          if honoured:
              lines += [f"#### npm audit exceptions honoured in `{md(here)}`", "",
                        "| Advisory | Reason | Expires | Packages excused |", "|---|---|---|---|"]
          for g, x in honoured.items():
              covers = ", ".join(sorted(x["covers"]))
              print(f"::warning::npm audit exception honoured in {cmd(here)}: {g} (expires {x['expires']}): {cmd(x['reason'])}; excuses: {cmd(covers)}")
              lines.append(f"| [{g}](https://github.com/advisories/{g}) | {md(x['reason'])} | {x['expires']} | {md(covers)} |")
          for g, x in sorted(exceptions.items()):
              if not x["covers"]:
                  print(f"::notice::stale npm audit exception: {g} excused nothing at or above {level} in {cmd(here)}; remove it if it is no longer needed")
                  lines.append(f"- stale npm audit exception `{g}`: excused nothing at or above {level} in `{md(here)}`")
          for name, sev, unexcused in failing[:50]:
              ids = "; ".join(f"{k} {a['title']}" for k, a in sorted(unexcused.items()))
              print(f"::error::npm audit in {cmd(here)}: {cmd(name)} ({sev}): {cmd(ids)}")
          if len(failing) > 50:
              print(f"::error::npm audit in {cmd(here)}: and {len(failing) - 50} more package(s)")
          for msg in errors:
              print(f"::error::{cmd(msg)}")
              lines.append(f"- **{md(msg)}**")
          if lines:
              summary(lines)
          print(f"npm audit {here}: {len(at_level)} package(s) at or above {level}: "
                f"{len(failing)} failing, {len(at_level) - len(failing)} excused by exception")
          sys.exit(1 if failing or errors else 0)
          PY
            rm -f -- "$report"
            [ "$verdict" -eq 0 ]
          }
          # <<< shared npm audit exceptions
          state="${RUNNER_TEMP:-/tmp}"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # One "<kind><TAB><dir>" line per detected directory. The kind comes
          # from the files present and the manifest's own contents.
          plan=$(mktemp)
          python3 -I - "$state/npm-dirs.json" > "$plan" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              dirs = json.load(fh)
          DEP_KEYS = ("dependencies", "devDependencies", "optionalDependencies", "peerDependencies")
          for d in dirs:
              def at(name):
                  return name if d == "." else d + "/" + name
              if os.path.isfile(at("package-lock.json")) or os.path.isfile(at("npm-shrinkwrap.json")):
                  kind = "npm"
              elif os.path.isfile(at("pnpm-lock.yaml")):
                  kind = "pnpm"
              elif os.path.isfile(at("yarn.lock")):
                  kind = "yarn"
              else:
                  try:
                      with open(at("package.json"), encoding="utf-8") as fh:
                          manifest = json.load(fh)
                  except (OSError, ValueError):
                      manifest = None
                  if not isinstance(manifest, dict):
                      kind = "unreadable"
                  elif any(manifest.get(k) for k in DEP_KEYS):
                      kind = "nolock"
                  else:
                      kind = "nodeps"
              # Bytes, not print(): a text-mode stdout may write "\r\n", and
              # the CR would become part of the directory bash cd's into.
              sys.stdout.buffer.write((kind + "\t" + d + "\n").encode())
          PY
          {
            echo "## npm audit (level: $NPM_AUDIT_LEVEL)"
            echo ""
          } >> "$summary"
          fail=0
          examined=0
          while IFS=$'\t' read -r kind dir; do
            [ -z "$dir" ] && continue
            case "$kind" in
              npm)
                # The audit reads only the lockfile, so first prove the lockfile
                # is the tree: `npm ci --dry-run` refuses (EUSAGE) when this
                # package.json or any workspace member folded into it has
                # drifted from the lockfile, and installs nothing (probed on
                # npm 11.7, 2026-11-16). Without it a dependency added to a
                # member but not locked was reported "audited through <root>"
                # while no audit saw it (gate pass 1 on 6a5ac8ad, SC-07).
                if ! ( cd -- "$dir" && npm ci --dry-run --ignore-scripts --no-audit --no-fund >/dev/null ); then
                  echo "::error::not examined: the lockfile in $dir is out of sync with $dir/package.json or a workspace member (npm ci --dry-run refused); run npm install and commit the lockfile"
                  printf -- '- `%s`: **NOT EXAMINED** (lockfile out of sync)\n' "$dir" >> "$summary"
                  fail=1
                  continue
                fi
                echo "::group::npm audit $dir"
                # Honours .github/npm-audit-exceptions.json (shared block above).
                if npm_audit_gate "$(pwd -P)" "$dir" "$NPM_AUDIT_LEVEL" --package-lock-only; then
                  printf -- '- `%s`: clean at %s\n' "$dir" "$NPM_AUDIT_LEVEL" >> "$summary"
                else
                  echo "::error::npm audit failed in $dir: advisories at or above $NPM_AUDIT_LEVEL that no exception excuses, an invalid or expired exception, or the audit could not run"
                  printf -- '- `%s`: **FAILED**\n' "$dir" >> "$summary"
                  fail=1
                fi
                echo "::endgroup::"
                examined=$((examined + 1))
                ;;
              nodeps)
                echo "$dir/package.json declares no dependencies: nothing to audit"
                printf -- '- `%s`: no dependencies declared\n' "$dir" >> "$summary"
                examined=$((examined + 1))
                ;;
              pnpm|yarn)
                echo "::error::not examined: $dir has a $kind lockfile and no package-lock.json; this gate runs npm audit only (pnpm support: work item b523b182)"
                printf -- '- `%s`: **NOT EXAMINED** (%s lockfile)\n' "$dir" "$kind" >> "$summary"
                fail=1
                ;;
              nolock)
                echo "::error::not examined: $dir/package.json declares dependencies but no package-lock.json is committed, and npm audit needs one"
                printf -- '- `%s`: **NOT EXAMINED** (no lockfile)\n' "$dir" >> "$summary"
                fail=1
                ;;
              *)
                echo "::error::not examined: $dir/package.json is not a readable JSON object"
                printf -- '- `%s`: **NOT EXAMINED** (unreadable package.json)\n' "$dir" >> "$summary"
                fail=1
                ;;
            esac
          done < "$plan"
          rm -f "$plan"
          python3 -I - "$state/npm-covered.json" >> "$summary" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              covered = json.load(fh)
          for member, root in sorted(covered.items()):
              print(f"- `{member}`: workspace member, audited through `{root}`")
          PY
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          if [ "$examined" -eq 0 ]; then
            echo "::error::no npm manifest was examined"
            exit 1
          fi

  tag-matches-version:
    needs: read-config
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert tag matches package version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # Promotion candidates (v1-rcN, cut by promote-canary.yml and mirrored
          # to the canary) are not consumer releases: the tag names the
          # dev-standards ref under test, not the canary's own version. The
          # version still has to exist and parse; only the equality is waived.
          PROMOTION_RC=false
          if [[ "$TAG_VERSION" =~ ^[0-9]+-rc[0-9]+$ ]]; then
            PROMOTION_RC=true
            echo "::notice::Promotion candidate tag v$TAG_VERSION: version equality not applicable"
          fi
          if [ "$TAG_VERSION" = "$GITHUB_REF" ]; then
            echo "::error::Workflow not triggered by a v* tag (GITHUB_REF=$GITHUB_REF)"
            exit 1
          fi

          # Source of truth precedence (release/SPEC.md "Versioning rules"):
          # package.json -> pyproject.toml -> Cargo.toml -> version.json ->
          # release-config.yml:version. Cargo.toml and the root version.json
          # (STANDARDS section 3; what docker-release's deploy health reads)
          # were missing until 2026-11-03, so a Rust repo had no source at all.
          if [ -f package.json ]; then
            PKG_VERSION=$(jq -r .version package.json)
            SOURCE=package.json
          elif [ -f pyproject.toml ]; then
            PKG_VERSION=$(yq '.project.version // .tool.poetry.version' -p toml pyproject.toml)
            SOURCE=pyproject.toml
          elif [ -f Cargo.toml ]; then
            PKG_VERSION=$(yq '.package.version // ""' -p toml Cargo.toml)
            SOURCE=Cargo.toml
          elif [ -f version.json ]; then
            PKG_VERSION=$(jq -r '.version // ""' version.json)
            SOURCE=version.json
          else
            PKG_VERSION=$(yq '.version // ""' release-config.yml)
            SOURCE=release-config.yml
          fi

          if [ -z "$PKG_VERSION" ] || [ "$PKG_VERSION" = "null" ]; then
            echo "::error::No version found in $SOURCE"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            if [ "$PROMOTION_RC" = "true" ]; then
              echo "✓ promotion candidate v$TAG_VERSION; $SOURCE version is $PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Tag v$TAG_VERSION does not match $SOURCE version $PKG_VERSION"
              exit 1
            fi
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ tag v$TAG_VERSION matches $SOURCE version $PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"

  # STANDARDS §13 Application Independence Floor (IMPL-34). A release carries a
  # committed, human-runnable runbook (AI-4) and its notes state where it stands
  # against AI-1..AI-8. The notes are the CHANGELOG section for the version.
  # WARN-MODE SOAK per §4's rollout pattern: continue-on-error until the first
  # month of enrolled releases is clean, then delete the line below to block.
  # Promotion candidates (v1-rcN) are dev-standards' own ref under test and
  # have no consumer release notes, so they are skipped.
  independence-note:
    needs: [read-config, tag-matches-version]
    if: needs.read-config.outputs.independence != 'harness' && !contains(github.ref, '-rc')
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runbook committed and release notes carry the independence line
        shell: bash
        env:
          VERSION: ${{ needs.tag-matches-version.outputs.version }}
          MODE: ${{ needs.read-config.outputs.independence }}
        run: |
          set -euo pipefail
          fail=0

          if [ -f RELEASE.md ] || [ -f docs/RELEASE.md ]; then
            echo "✓ release runbook committed (independence: $MODE)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No RELEASE.md or docs/RELEASE.md. A release only an agent's memory can reproduce is non-conforming (STANDARDS §13 AI-4)."
            fail=1
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md: the release notes for v$VERSION must state 'independence: AI-1..AI-8 pass' or list the failing items (STANDARDS §13.3 item 4)."
            exit 1
          fi

          # >>> shared changelog section
          # One definition, byte-identical in release-gates.yml (independence-note)
          # and lib-release.yml (release notes); documented in release/SPEC.md
          # "CHANGELOG sections", locked by scripts/tests/test_changelog_section.py.
          # `changelog_section VERSION FILE` prints the FIRST section naming
          # VERSION, its heading line included, up to (not including) the next
          # level-2 heading. A heading names VERSION when it is `## ` followed by
          # `[x.y.z]`, `x.y.z`, `vx.y.z` or `[vx.y.z]` and then end of line or a
          # character that cannot continue a version (` — title`, ` - 2026-11-17`,
          # `(date)`), so 0.14.80 and 0.14.8-rc.1 never name 0.14.8. Dots and `+`
          # in VERSION are literal. Lines inside a ``` or ~~~ fence are body text,
          # never headings. awk: `[[]` / `[]]` match the brackets (an escaped
          # bracket in an awk string is read differently by mawk and gawk); no
          # `{m,n}` intervals (older mawk lacks them).
          changelog_section() {
            awk -v ver="$1" '
              BEGIN {
                gsub(/[.+]/, "[&]", ver)
                heading = "^##[ \t]+([[]v?" ver "[]]|v?" ver ")([^0-9A-Za-z._+-]|$)"
              }
              /^ ? ? ?(```|~~~)/ { fence = !fence }
              !fence && /^##[ \t]/ { if (inside) exit; inside = ($0 ~ heading) }
              inside { print }
            ' "$2"
          }
          # <<< shared changelog section

          # The section for this version, in any accepted heading form.
          section=$(changelog_section "$VERSION" CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION (a '## [$VERSION]', '## $VERSION', '## v$VERSION' or '## [v$VERSION]' heading); the release notes must exist to carry the independence line."
            fail=1
          elif printf '%s\n' "$section" | grep -qiE '^[[:space:]]*[-*]?[[:space:]]*\**independence\**[[:space:]]*:'; then
            line=$(printf '%s\n' "$section" | grep -iE '^[[:space:]]*[-*]?[[:space:]]*\**independence\**[[:space:]]*:' | head -1 | sed 's/^[[:space:]]*//')
            echo "✓ release notes: $line" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::CHANGELOG.md section $VERSION has no 'independence:' line. Add 'independence: AI-1..AI-8 pass' or list the failing items with their IMPL numbers (STANDARDS §13.3 item 4)."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::warning::independence-note is in warn-mode soak (STANDARDS §13.4, IMPL-34); this will block once the soak ends."
            exit 1
          fi

  conventional-commits-lint:
    needs: read-config
    if: needs.read-config.outputs.conventional_commits_enabled == 'true'
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint commits since previous tag
        shell: bash
        run: |
          set -euo pipefail
          if PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
            range="${PREV_TAG}..HEAD"
          else
            range="HEAD"
          fi
          fail=0
          # Conventional Commits header: type(scope?)!?: subject
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            # Skip merge commits.
            case "$msg" in
              "Merge "*) continue ;;
            esac
            if ! [[ "$msg" =~ $re ]]; then
              echo "::error::Non-conventional commit: $msg"
              fail=1
            fi
          done < <(git log "$range" --no-merges --pretty=format:"%s")
          [ "$fail" -eq 0 ] || exit 1

  # IMPL-5 — version-uniqueness gate.
  # Structural rule (no input toggle). Motivating scar: APM v0.9.2 had two
  # version.json files (root=0.9.2, server/=0.9.1). Gate-green + runtime-wrong.
  # This gate makes that state impossible by construction.
  version-uniqueness:
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert all version.json files agree
        shell: bash
        run: |
          set -euo pipefail
          # Find every version.json, excluding common build/vendor/VCS dirs.
          mapfile -t files < <(find . -type f -name version.json \
            -not -path './node_modules/*' \
            -not -path '*/node_modules/*' \
            -not -path './vendor/*' \
            -not -path '*/vendor/*' \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -not -path '*/dist/*' \
            -not -path './build/*' \
            -not -path '*/build/*' \
            -not -path './target/*' \
            -not -path '*/target/*')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "no version.json files found — nothing to compare"
            exit 0
          fi

          if [ "${#files[@]}" -eq 1 ]; then
            v=$(jq -r .version "${files[0]}")
            echo "single version.json: ${files[0]} = $v"
            exit 0
          fi

          # Multiple files — extract every value and compare.
          declare -a pairs
          first=""
          divergent=0
          for f in "${files[@]}"; do
            v=$(jq -r .version "$f")
            pairs+=("  $f : $v")
            if [ -z "$first" ]; then
              first="$v"
            elif [ "$v" != "$first" ]; then
              divergent=1
            fi
          done

          if [ "$divergent" -eq 1 ]; then
            echo "::error::version.json drift detected"
            for p in "${pairs[@]}"; do
              echo "$p"
            done
            exit 1
          fi

          {
            echo "## version-uniqueness"
            echo ""
            echo "All ${#files[@]} version.json files agree on \`$first\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # IMPL-7 — Go vulnerability gate (warn-mode soak ends 2026-05-15).
  # To flip to blocking after the soak: remove `continue-on-error: true` below
  # and delete this comment block.
  # Motivating scar: APM had 1 critical (pgx memory-safety) + 7 high Go-side
  # CVEs invisible to the npm-only `npm_audit` gate.
  govulncheck:
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Go modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t mods < <(find . -type f -name go.mod \
            -not -path './vendor/*' \
            -not -path '*/vendor/*' \
            -not -path './.git/*')
          if [ "${#mods[@]}" -eq 0 ]; then
            echo "no go.mod found — skipping govulncheck"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${mods[@]}" > /tmp/go-mods.txt
          echo "Go modules detected:"
          cat /tmp/go-mods.txt

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.found == 'true'
        with:
          # No Actions cache in a release path (audit 2026-10-27, R-C).
          cache: false
          go-version: 'stable'

      - name: Install govulncheck
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Pinned, never @latest: this job holds security-events: write. The pin is
          # chosen from the Go this job PROVISIONED (go.mod via setup-go, under
          # GOTOOLCHAIN=local), because each x/vuln release raises its go directive:
          # v1.8.0 needs 1.26, v1.2.0-v1.7.0 need 1.25, v1.1.4 needs 1.22 (verified
          # from proxy.golang.org .mod files, 2026-10-08). A single pin failed the
          # fleet twice in one day: v1.8.0 on every 1.25 repo (Sentinel #107), then
          # v1.7.0 on a 1.24 module (openclaw-1 #12). The vuln DB is fetched live
          # from vuln.go.dev, so an older binary does not weaken the scan. Add a row
          # when the fleet's floor moves; never fall through to @latest.
          gover="$(go env GOVERSION)"            # e.g. go1.25.14
          minor="$(printf '%s' "$gover" | sed -E 's/^go1\.([0-9]+).*$/\1/')"
          case "$minor" in
            ''|*[!0-9]*) echo "::error::cannot parse Go version '$gover' for the govulncheck pin table"; exit 1 ;;
          esac
          if   [ "$minor" -ge 26 ]; then vuln_pin=v1.8.0
          elif [ "$minor" -ge 25 ]; then vuln_pin=v1.7.0
          elif [ "$minor" -ge 22 ]; then vuln_pin=v1.1.4
          else echo "::error::no govulncheck pin for $gover (table floor is go1.22); raise the module's go directive"; exit 1
          fi
          echo "govulncheck pin for $gover: $vuln_pin"
          go install "golang.org/x/vuln/cmd/govulncheck@$vuln_pin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck on every module
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "::group::govulncheck $dir"
            if ! ( cd "$dir" && govulncheck ./... ); then
              fail=1
            fi
            echo "::endgroup::"
          done < /tmp/go-mods.txt
          if [ "$fail" -ne 0 ]; then
            echo "::error::govulncheck found call-graph-reachable vulnerabilities"
            exit 1
          fi

  # IMPL-7 — Python vulnerability gate (warn-mode soak ends 2026-05-15).
  # To flip to blocking after the soak: remove `continue-on-error: true` below
  # and delete this comment block.
  # Motivating scar: same as govulncheck — Python deps invisible to npm_audit.
  pip_audit:
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Python dependency manifests
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/py-manifests.txt
          # requirements*.txt anywhere
          find . -type f \( -name 'requirements.txt' -o -name 'requirements-*.txt' -o -name 'requirements_*.txt' \) \
            -not -path './node_modules/*' -not -path '*/node_modules/*' \
            -not -path './vendor/*' -not -path '*/vendor/*' \
            -not -path './.git/*' \
            -not -path './dist/*' -not -path '*/dist/*' \
            -not -path './build/*' -not -path '*/build/*' \
            >> /tmp/py-manifests.txt || true
          # Pipfile / pyproject.toml / poetry.lock
          find . -type f \( -name 'Pipfile' -o -name 'pyproject.toml' -o -name 'poetry.lock' \) \
            -not -path './node_modules/*' -not -path '*/node_modules/*' \
            -not -path './vendor/*' -not -path '*/vendor/*' \
            -not -path './.git/*' \
            -not -path './dist/*' -not -path '*/dist/*' \
            -not -path './build/*' -not -path '*/build/*' \
            >> /tmp/py-manifests.txt || true

          if [ ! -s /tmp/py-manifests.txt ]; then
            echo "no Python dependency manifests found — skipping pip-audit"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Python manifests detected:"
          cat /tmp/py-manifests.txt

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: '3.x'

      - name: Install pip-audit
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Run pip-audit on every manifest
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # Deduplicate: pyproject.toml + poetry.lock at the same dir audit once.
          # We resolve each manifest to its dir and the manifest type, then audit.
          declare -A seen_dirs
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            base=$(basename "$manifest")
            dir=$(dirname "$manifest")
            case "$base" in
              requirements*.txt)
                echo "::group::pip-audit -r $manifest"
                if ! pip-audit --strict --vulnerability-service osv -r "$manifest"; then
                  fail=1
                fi
                echo "::endgroup::"
                ;;
              Pipfile|pyproject.toml|poetry.lock)
                key="$dir"
                if [ -n "${seen_dirs[$key]:-}" ]; then continue; fi
                seen_dirs[$key]=1
                echo "::group::pip-audit project $dir"
                if ! ( cd "$dir" && pip-audit --strict --vulnerability-service osv ); then
                  fail=1
                fi
                echo "::endgroup::"
                ;;
            esac
          done < /tmp/py-manifests.txt

          # pip-audit's severity model is per-vuln; --strict ensures non-zero
          # exit on any finding. We treat any high+critical as a fail; pip-audit
          # itself reports all findings — we filter at the gate level by parsing
          # if needed. For the warn-mode soak we surface every finding.
          if [ "$fail" -ne 0 ]; then
            echo "::error::pip-audit found vulnerabilities (high/critical block in non-warn mode)"
            exit 1
          fi

  # IMPL-7 — Rust vulnerability gate (warn-mode soak ends 2026-05-15).
  # To flip to blocking after the soak: remove `continue-on-error: true` below
  # and delete this comment block.
  # Motivating scar: same blind-spot pattern as Go/Python — Cargo deps invisible
  # to the npm-only audit.
  cargo_audit:
    runs-on: ${{ inputs.runs_on || (github.event.repository.private && (vars.CI_RUNNER || 'nexus-ci')) || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Cargo manifests
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cargos < <(find . -type f -name Cargo.toml \
            -not -path './node_modules/*' -not -path '*/node_modules/*' \
            -not -path './vendor/*' -not -path '*/vendor/*' \
            -not -path './.git/*' \
            -not -path './target/*' -not -path '*/target/*' \
            -not -path './dist/*' -not -path '*/dist/*' \
            -not -path './build/*' -not -path '*/build/*')
          if [ "${#cargos[@]}" -eq 0 ]; then
            echo "no Cargo.toml found — skipping cargo-audit"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${cargos[@]}" > "${RUNNER_TEMP:-/tmp}/cargo-manifests.txt"
          echo "Cargo manifests detected:"
          cat "${RUNNER_TEMP:-/tmp}/cargo-manifests.txt"

      - name: Install cargo-audit
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # cargo-audit ships as a static binary via rustsec releases. The
          # archive is verified against its SHA-256 before anything in it runs.
          # 0.21.1 could not parse newer advisory-db entries (RUSTSEC-2026-0320
          # TOML parse error, steward-governance run 41692008392, 2026-11-03),
          # which reported as "found advisories" when none were found.
          CA_VERSION=0.22.2
          CA_SHA256=7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CA_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CA_VERSION}.tgz" \
            -o /tmp/cargo-audit.tgz
          echo "${CA_SHA256}  /tmp/cargo-audit.tgz" | sha256sum -c -
          tar -xzf /tmp/cargo-audit.tgz -C /tmp
          install -m 0755 "/tmp/cargo-audit-x86_64-unknown-linux-musl-v${CA_VERSION}/cargo-audit" /usr/local/bin/cargo-audit
          cargo-audit --version

      - name: Run cargo-audit on every manifest
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # cargo-audit operates on the lockfile next to each Cargo.toml.
          # Workspace members share their workspace's Cargo.lock, so we
          # deduplicate by the directory containing Cargo.lock.
          declare -A seen_locks
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            dir=$(dirname "$manifest")
            # Walk up to find the nearest Cargo.lock (workspace members share
            # the workspace root's lockfile).
            lockdir="$dir"
            while [ "$lockdir" != "." ] && [ "$lockdir" != "/" ] && [ ! -f "$lockdir/Cargo.lock" ]; do
              lockdir=$(dirname "$lockdir")
            done
            if [ ! -f "$lockdir/Cargo.lock" ]; then
              # Not examined is not clean: before 2026-11-16 this was a
              # warning and `continue`, so a crate with no lockfile passed
              # having been audited by nothing (audit-keystone-2026-11-16).
              echo "::error::not examined: no Cargo.lock alongside or above $manifest (a releasable Rust crate must commit Cargo.lock)"
              fail=1
              continue
            fi
            key="$lockdir"
            if [ -n "${seen_locks[$key]:-}" ]; then continue; fi
            seen_locks[$key]=1
            echo "::group::cargo-audit $lockdir/Cargo.lock"
            if ! cargo-audit audit --file "$lockdir/Cargo.lock"; then
              fail=1
            fi
            echo "::endgroup::"
          done < "${RUNNER_TEMP:-/tmp}/cargo-manifests.txt"
          if [ "$fail" -ne 0 ]; then
            echo "::error::cargo-audit found advisories"
            exit 1
          fi
