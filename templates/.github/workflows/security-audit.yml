name: Security Audit (Layer A)

# Layer A of the dev-standards dependency hygiene model.
# Always-on CI gate: runs on every PR, every push to main, and manually.
# Fails the workflow if any high-or-critical vulnerability is found in the
# dependency graph. Moderate / low findings are logged for visibility but
# don't fail the build.
#
# Detect-and-dispatch: every tracked manifest ANYWHERE in the tree (from
# `git ls-files`, never node_modules) selects an ecosystem, and each ecosystem
# job runs once per manifest directory. A root-only check missed every repo
# whose manifests live in a subdirectory and then reported green having
# examined nothing (audit-ai-console-2026-09-28, MEDIUM; proposed SC-26).
#
# Unknown is never clean:
# - a detected ecosystem whose job did not SUCCEED fails the summary, and
#   `skipped` counts as not succeeding.
# - a repo with no manifest at all fails, unless it declares that in
#   `.github/security-audit-no-manifests`. The file's content is the reason,
#   and it must not be empty.
# - a failed detect job fails the summary.
#
# Runner and trust (audit-dev-standards-2026-10-10 HIGH 3; SC-37, SC-13):
# - Trusted events are push, workflow_dispatch, schedule and release: code
#   someone with write access already put on a branch of this repo. Every
#   other event, pull_request above all, is untrusted: its code is the PR's.
# - A repository variable may choose the runner ONLY on a trusted event.
#   Every job says
#     runs-on: <trusted> && vars.CI_RUNNER || 'ubuntu-latest'
#   so an untrusted event resolves to the GitHub-hosted literal whatever
#   CI_RUNNER holds (`&&`/`||` return an operand: false && x is false, and
#   false || 'ubuntu-latest' is the literal). A self-hosted label never runs
#   pull_request code from here. That does not stop a fork PR that EDITS this
#   file; for that, no self-hosted runner may serve a public repository.
# - On an untrusted event no code the PR controls is executed. Lifecycle
#   scripts, a .pnpmfile.cjs, a yarnPath, yarn plugins, a .corepack.env, a
#   custom-URL packageManager and a Python build backend are all such code;
#   each is shut off below where it would run. What cannot be audited
#   without running it is reported NOT EXAMINED, which fails like a finding.
#   On a trusted event the repo's own configuration is honoured.
# - The token is contents: read and nothing else.
#
# Design ref: shared-brain decision 81b962de-3e94-4d67-9093-7dbb5644094d
# Critique:   shared-brain knowledge 7b258d5c-dcf4-49e9-973a-5e92b951a019

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # 'true' on a trusted event, 'false' otherwise: the same predicate as every
  # job's runs-on. Scripts treat anything but the exact string 'true' as
  # untrusted.
  TRUSTED_EVENT: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release"]'), github.event_name) }}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect ecosystems
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release"]'), github.event_name) && vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      has_npm: ${{ steps.detect.outputs.has_npm }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_python: ${{ steps.detect.outputs.has_python }}
      npm_dirs: ${{ steps.detect.outputs.npm_dirs }}
      go_dirs: ${{ steps.detect.outputs.go_dirs }}
      python_dirs: ${{ steps.detect.outputs.python_dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit installs PR-controlled code; it never pushes, so the token
          # is not persisted where that code could read it.
          persist-credentials: false

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          # Directories (repo-relative, "." for the root) that hold a tracked
          # manifest matching the pathspecs, as a JSON array.
          # The filtering is done in python, not grep: under pipefail an empty
          # grep exits 1 and would kill this step for every repo that lacks
          # one of the ecosystems.
          dirs_of() {
            git ls-files -z -- "$@" | python3 -c '
          import json, posixpath, sys
          paths = [p for p in sys.stdin.buffer.read().decode().split("\0") if p]
          # A directory name is repo content a PR controls. A control character
          # (a newline above all) could forge a `::command::` line when a later
          # step echoes it, so refuse, never pass it on.
          hostile = [p for p in paths if any(ord(c) < 0x20 or ord(c) == 0x7f for c in p)]
          if hostile:
              sys.exit("control character in manifest path(s): " + ", ".join(repr(p) for p in hostile))
          keep = sorted({posixpath.dirname(p) or "." for p in paths
                         if "node_modules" not in p.split("/")})
          print(json.dumps(keep))'
          }
          npm_dirs=$(dirs_of 'package.json' '**/package.json')
          go_dirs=$(dirs_of 'go.mod' '**/go.mod')
          python_dirs=$(dirs_of 'pyproject.toml' '**/pyproject.toml' 'requirements*.txt' '**/requirements*.txt')
          count() { python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$1"; }
          n_npm=$(count "$npm_dirs"); n_go=$(count "$go_dirs"); n_py=$(count "$python_dirs")
          has_npm=false; [ "$n_npm" -gt 0 ] && has_npm=true
          has_go=false; [ "$n_go" -gt 0 ] && has_go=true
          has_python=false; [ "$n_py" -gt 0 ] && has_python=true
          {
            echo "has_npm=$has_npm"; echo "has_go=$has_go"; echo "has_python=$has_python"
            echo "npm_dirs=$npm_dirs"; echo "go_dirs=$go_dirs"; echo "python_dirs=$python_dirs"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::ecosystems: npm=$npm_dirs go=$go_dirs python=$python_dirs"
          if [ $((n_npm + n_go + n_py)) -eq 0 ]; then
            declared=.github/security-audit-no-manifests
            if [ -s "$declared" ] && grep -q '[^[:space:]]' "$declared"; then
              echo "::notice::no dependency manifests; declared in $declared: $(head -c 200 "$declared" | tr '\n' ' ')"
            else
              echo "::error::no dependency manifest found anywhere in the tree, so nothing was audited. If this repo truly has no dependencies, say why in $declared."
              exit 1
            fi
          fi

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    needs: detect
    if: needs.detect.outputs.has_npm == 'true'
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release"]'), github.event_name) && vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # A PR's .corepack.env can set COREPACK_ENABLE_UNSAFE_CUSTOM_URLS=1,
      # after which a `packageManager` URL to a .js file runs as the package
      # manager (verified on corepack 0.34, the line Node 20 bundles). Never
      # read the file and never allow the URLs; process env beats the file.
      COREPACK_ENV_FILE: '0'
      COREPACK_ENABLE_UNSAFE_CUSTOM_URLS: '0'
      # Lifecycle scripts stay off in every npm process, including the nested
      # `npm install` npm runs to prepare a git dependency, which does not get
      # the --ignore-scripts flag. Env beats a project .npmrc.
      npm_config_ignore_scripts: 'true'
      # Matrix value reaches scripts through env, never `${{ }}` in run:.
      DIR: ${{ matrix.dir }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.npm_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit installs PR-controlled code; it never pushes, so the token
          # is not persisted where that code could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '20'

      - name: Install (npm ci or pnpm install or yarn install)
        shell: bash
        run: |
          set -euo pipefail
          # The audit reads the resolved dependency graph (lockfile + installed
          # tree), so nothing the repo ships needs to run. Lifecycle scripts
          # never run, on any event (--ignore-scripts, --mode=skip-build, and
          # npm_config_ignore_scripts in the job env). On an untrusted event
          # (TRUSTED_EVENT is not 'true': a pull_request) the other ways a
          # package manager runs repo code are shut as well; see each branch.
          # Package-manager versions are pinned, never @latest/@stable: a
          # `packageManager` field in package.json still wins under corepack;
          # these are only the fallback. pnpm 10 is the newest line that runs
          # on the Node 20 set up above (pnpm 11 needs Node >= 22.13).
          not_examined() {
            echo "::error::not examined: $1"
            printf -- '- npm (%s): **NOT EXAMINED**: %s\n' "$DIR" "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          }
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            corepack prepare pnpm@10.34.6 --activate
            if [ "${TRUSTED_EVENT:-}" = "true" ]; then
              pnpm install --frozen-lockfile --ignore-scripts
            else
              # install AND audit load .pnpmfile.cjs (or whatever `pnpmfile`
              # names) unless told not to. A lockfile written with a pnpmfile
              # records its checksum, and a frozen install will not go on
              # without running it, so that check cannot be made here.
              if grep -q '^pnpmfileChecksum:' pnpm-lock.yaml; then
                not_examined "pnpm-lock.yaml was written with a pnpmfile; checking it against package.json means running that file, which the pull request controls"
              fi
              pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
            fi
          elif [ -f yarn.lock ]; then
            corepack enable
            if [ "${TRUSTED_EVENT:-}" != "true" ]; then
              # A yarnPath (berry .yarnrc.yml) or yarn-path (v1 .yarnrc) is a
              # JS file yarn hands control to. Exported for the audit step too.
              export YARN_IGNORE_PATH=1
              echo "YARN_IGNORE_PATH=1" >> "${GITHUB_ENV:-/dev/null}"
            fi
            # The lockfile says which yarn wrote it: berry (>= 2) carries a
            # `__metadata:` block, classic v1 a "yarn lockfile v1" header.
            if grep -q '^__metadata:' yarn.lock; then
              corepack prepare yarn@4.18.1 --activate
              if [ "${TRUSTED_EVENT:-}" != "true" ]; then
                # `plugins:` in .yarnrc.yml are JS files yarn loads on every
                # command; YARN_IGNORE_PATH does not stop them. Yarn reads its
                # rc files under the name in YARN_RC_FILENAME, from here up
                # to /, so each .yarnrc.yml from the checkout root down to
                # here is rewritten under a name the PR cannot predict,
                # without yarnPath or plugins and with scripts off. yq (on
                # every GitHub-hosted image, which is where an untrusted
                # event runs) parses it, so quoting, anchors and merge keys
                # cannot carry a key past the rewrite: yarn reads only yq's
                # JSON output.
                command -v yq > /dev/null || not_examined "yq is not on this runner, so the repo's .yarnrc.yml cannot be read without running the plugins it names"
                rc_name=".yarnrc-audit-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n').yml"
                top="$(cd "${GITHUB_WORKSPACE:-$PWD}" && pwd -P)"
                d="$(pwd -P)"
                while :; do
                  if [ -f "$d/.yarnrc.yml" ]; then
                    yq -o=json 'explode(.) | del(.yarnPath) | del(.plugins) | .enableScripts = false' "$d/.yarnrc.yml" > "$d/$rc_name"
                  fi
                  if [ "$d" = "$top" ] || [ "$d" = "/" ]; then break; fi
                  d="$(dirname "$d")"
                done
                export YARN_RC_FILENAME="$rc_name"
                echo "YARN_RC_FILENAME=$rc_name" >> "${GITHUB_ENV:-/dev/null}"
              fi
              yarn install --immutable --mode=skip-build
            elif grep -q '^# yarn lockfile v1' yarn.lock; then
              corepack prepare yarn@1.22.22 --activate
              yarn install --frozen-lockfile --ignore-scripts
            else
              echo "::error::yarn.lock is neither a yarn berry nor a yarn v1 lockfile; nothing can be audited"
              exit 1
            fi
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts
          else
            echo "::warning::No npm lockfile found; running 'npm install' (audit results may be less reliable)"
            npm install --no-audit --no-fund --ignore-scripts
          fi

      - name: Audit (low/moderate logged, high/critical fails)
        shell: bash
        run: |
          set -euo pipefail
          # yarn: `npm audit` needs a package-lock.json, so a yarn repo used to
          # fail here on every run. Each yarn flavour reports through its own
          # audit, and its exit code alone cannot tell "found something" from
          # "could not audit", so the JSON it writes decides:
          #   berry:   `yarn npm audit --all --recursive --json` prints one
          #            advisory object per line and exits 1 if there is any,
          #            0 (and prints nothing) if there is none.
          #   classic: `yarn audit --json` ends with an auditSummary line; its
          #            exit code is a severity bitmask (1 info, 2 low,
          #            4 moderate, 8 high, 16 critical).
          # No report means not examined, which fails like a finding does.
          if [ ! -f pnpm-lock.yaml ] && [ -f yarn.lock ]; then
            rc=0
            if grep -q '^__metadata:' yarn.lock; then
              flavour=berry
              yarn npm audit --all --recursive --json > audit-yarn.json || rc=$?
            else
              flavour=classic
              yarn audit --json > audit-yarn.json || rc=$?
            fi
            python3 - audit-yarn.json "$rc" "$flavour" <<'PY'
          import json, sys
          path, rc, flavour = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          def not_examined(why):
              print(f"::error::yarn {flavour} audit could not run (exit {rc}): {why}; nothing was audited")
              sys.exit(1)
          frames = []
          for line in open(path, encoding="utf-8", errors="replace"):
              if line.strip():
                  try:
                      frames.append(json.loads(line))
                  except ValueError:
                      not_examined("output is not the JSON audit report")
          counts = dict.fromkeys(("info", "low", "moderate", "high", "critical"), 0)
          if flavour == "berry":
              advisories = [f for f in frames if isinstance(f, dict) and isinstance(f.get("children"), dict) and "value" in f]
              if len(advisories) != len(frames):
                  not_examined("output holds something other than advisories")
              if (rc == 0) != (not advisories) or rc not in (0, 1):
                  not_examined("exit code and report disagree")
              for a in advisories:
                  sev = str(a["children"].get("Severity", "")).lower()
                  if sev not in counts:
                      not_examined(f"advisory without a known severity: {a.get('value')}")
                  counts[sev] += 1
          else:
              summary = [f for f in frames if isinstance(f, dict) and f.get("type") == "auditSummary"]
              if len(summary) != 1 or rc > 31:
                  not_examined("no audit summary")
              vulns = summary[0].get("data", {}).get("vulnerabilities", {})
              for sev in counts:
                  counts[sev] = int(vulns.get(sev, 0))
              bits = sum(bit for sev, bit in (("info", 1), ("low", 2), ("moderate", 4), ("high", 8), ("critical", 16)) if counts[sev])
              if bits != rc:
                  not_examined(f"exit code {rc} does not match the summary's severities ({bits})")
          print("yarn audit: " + " ".join(f"{k}={v}" for k, v in counts.items()))
          if counts["high"] or counts["critical"]:
              print(f"::error::yarn audit found {counts['high']} high and {counts['critical']} critical vulnerabilities")
              sys.exit(1)
          PY
            exit 0
          fi
          # Run informational audit (everything) — never fails the build.
          # pnpm audit loads the pnpmfile too, and a pnpm-workspace.yaml
          # setting beats an env var, so the switch is on the command line
          # (verified on pnpm 10.34.6). The audit reads only the lockfile.
          if [ -f pnpm-lock.yaml ]; then
            pnpm audit --json --config.ignore-pnpmfile=true > audit-info.json || true
          else
            npm audit --json > audit-info.json || true
          fi
          echo "----- audit summary (informational) -----"
          if command -v jq > /dev/null; then
            jq -r '
              if .metadata?.vulnerabilities? then
                .metadata.vulnerabilities | "info=\(.info // 0) low=\(.low // 0) moderate=\(.moderate // 0) high=\(.high // 0) critical=\(.critical // 0)"
              elif .advisories? then
                "advisories=\(.advisories | length)"
              else
                "audit produced no parseable summary"
              end
            ' audit-info.json || true
          fi
          echo "----- gating audit (high+critical) -----"
          # Real gate.
          if [ -f pnpm-lock.yaml ]; then
            pnpm audit --audit-level=high --config.ignore-pnpmfile=true
          else
            npm audit --audit-level=high
          fi

  go-vulncheck:
    name: govulncheck (${{ matrix.dir }})
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release"]'), github.event_name) && vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.go_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit installs PR-controlled code; it never pushes, so the token
          # is not persisted where that code could read it.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Install govulncheck if absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v govulncheck > /dev/null; then
            # Pinned, never @latest: an unpinned tool is code nobody reviewed. The pin is
            # chosen from the Go this job PROVISIONED (go.mod via setup-go, under
            # GOTOOLCHAIN=local), because each x/vuln release raises its go directive:
            # v1.8.0 needs 1.26, v1.2.0-v1.7.0 need 1.25, v1.1.4 needs 1.22 (verified
            # from proxy.golang.org .mod files, 2026-10-08). A single pin failed the
            # fleet twice in one day: v1.8.0 on every 1.25 repo (Sentinel #107), then
            # v1.7.0 on a 1.24 module (openclaw-1 #12). The vuln DB is fetched live
            # from vuln.go.dev, so an older binary does not weaken the scan. Add a row
            # when the fleet's floor moves; never fall through to @latest.
            gover="$(go env GOVERSION)"            # e.g. go1.25.14
            minor="$(printf '%s' "$gover" | sed -E 's/^go1\.([0-9]+).*$/\1/')"
            case "$minor" in
              ''|*[!0-9]*) echo "::error::cannot parse Go version '$gover' for the govulncheck pin table"; exit 1 ;;
            esac
            if   [ "$minor" -ge 26 ]; then vuln_pin=v1.8.0
            elif [ "$minor" -ge 25 ]; then vuln_pin=v1.7.0
            elif [ "$minor" -ge 22 ]; then vuln_pin=v1.1.4
            else echo "::error::no govulncheck pin for $gover (table floor is go1.22); raise the module's go directive"; exit 1
            fi
            echo "govulncheck pin for $gover: $vuln_pin"
            go install "golang.org/x/vuln/cmd/govulncheck@$vuln_pin"
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail
          # govulncheck only reports vulns whose vulnerable symbols are
          # actually called from your code, so any finding is high-signal —
          # treat any non-zero exit as a fail.
          govulncheck ./...

  pip-audit:
    name: pip-audit (${{ matrix.dir }})
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release"]'), github.event_name) && vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.python_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit installs PR-controlled code; it never pushes, so the token
          # is not persisted where that code could read it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install pip-audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip==26.2.1
          python -m pip install pip-audit==2.10.1

      - name: Run pip-audit (--strict gates the workflow)
        shell: bash
        # Values reach the script through env, never `${{ }}` inside run:
        # a directory name is PR-controlled text, and an expression is
        # pasted into the script before bash parses it (script injection).
        env:
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reqs=(requirements*.txt)
          locks=()
          for f in pylock.toml pylock.*.toml; do [ -f "$f" ] && locks+=("$f"); done
          not_examined() {
            echo "::error::not examined: $1"
            printf -- '- python (%s): **NOT EXAMINED**: %s\n' "$DIR" "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          }
          if [ ! -f pyproject.toml ] && [ ${#reqs[@]} -eq 0 ]; then
            # detect chose this directory for a python manifest; finding none
            # here means detect and audit disagree, which is never a pass.
            echo "::error::python detected in '$DIR' but no requirements*.txt or pyproject.toml there; nothing was audited"
            exit 1
          fi
          if [ "${TRUSTED_EVENT:-}" = "true" ]; then
            # Trusted event: resolving the graph may build packages, which is
            # acceptable for code already on a branch of this repo.
            # Prefer pyproject if both exist. The project PATH is required: a
            # bare `pip-audit` audits the runner's own environment, not this
            # project, and passes having examined none of its dependencies.
            if [ -f pyproject.toml ]; then
              pip-audit --strict .
            else
              for f in "${reqs[@]}"; do
                echo "----- pip-audit -r $f -----"
                pip-audit --strict -r "$f"
              done
            fi
            exit 0
          fi
          # Untrusted event (a pull_request): nothing is built. Resolving a
          # requirements file or a pyproject.toml installs into a scratch venv,
          # and pip builds any sdist, local path or URL the PR names there
          # (setup.py / the build backend run; verified on pip-audit 2.10.1).
          # So only what can be read without building is audited:
          #   pylock.toml          --locked reads the lock, installs nothing.
          #   requirements*.txt    --no-deps --disable-pip: every entry must
          #                        be pinned (==); an unpinned, path or URL
          #                        entry makes pip-audit fail, not guess.
          #   pyproject.toml       its [project].dependencies are audited only
          #                        through the files above; a declared
          #                        dependency none of them pins is NOT
          #                        EXAMINED, never clean.
          if [ ${#locks[@]} -gt 0 ]; then
            echo "----- pip-audit --locked (${locks[*]}) -----"
            pip-audit --strict --locked .
          fi
          for f in "${reqs[@]}"; do
            echo "----- pip-audit --no-deps --disable-pip -r $f -----"
            pip-audit --strict --no-deps --disable-pip -r "$f"
          done
          if [ -f pyproject.toml ] && [ ${#locks[@]} -eq 0 ]; then
            # Same interpreter as pip-audit, so its own parsers are present:
            # packaging, and pip-requirements-parser (what pip-audit reads -r
            # files with, nested -r included).
            if ! python - "${reqs[@]}" > pyproject-coverage.txt <<'PY'
          import sys
          import tomllib
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from pip_requirements_parser import RequirementsFile

          def fail(why):
              print(why)
              sys.exit(1)

          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh).get("project")
          if not isinstance(project, dict):
              fail("pyproject.toml has no [project] table, so its dependencies are known only by building it")
          if "dependencies" in (project.get("dynamic") or []):
              fail("pyproject.toml declares its dependencies dynamic, so they are known only by building it")
          declared = set()
          for spec in project.get("dependencies") or []:
              req = Requirement(spec)
              try:
                  applies = req.marker is None or req.marker.evaluate()
              except Exception:
                  applies = True
              if applies:
                  declared.add(canonicalize_name(req.name))
          pinned = set()
          for path in sys.argv[1:]:
              for r in RequirementsFile.from_file(path, include_nested=True).requirements:
                  if r.name:
                      pinned.add(canonicalize_name(r.name))
          missing = sorted(declared - pinned)
          if missing:
              files = ", ".join(sys.argv[1:]) or "no requirements*.txt"
              fail(f"pyproject.toml declares {', '.join(missing)}, which {files} does not pin and auditing would mean building; commit a pylock.toml or a pinned requirements file")
          print(f"pyproject.toml: {len(declared)} declared dependencies, each audited through a pinned requirements entry")
          PY
            then
              not_examined "$(cat pyproject-coverage.txt)"
            fi
            cat pyproject-coverage.txt
          fi

  summary:
    name: Audit summary (always runs)
    if: always()
    needs: [detect, npm-audit, go-vulncheck, pip-audit]
    runs-on: ${{ contains(fromJSON('["push","workflow_dispatch","schedule","release"]'), github.event_name) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - shell: bash
        # Every value through env, never `${{ }}` inside run: the *_DIRS lists
        # are PR-controlled directory names (script injection otherwise).
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          HAS_NPM: ${{ needs.detect.outputs.has_npm }}
          HAS_GO: ${{ needs.detect.outputs.has_go }}
          HAS_PYTHON: ${{ needs.detect.outputs.has_python }}
          NPM_DIRS: ${{ needs.detect.outputs.npm_dirs }}
          GO_DIRS: ${{ needs.detect.outputs.go_dirs }}
          PYTHON_DIRS: ${{ needs.detect.outputs.python_dirs }}
          NPM_RESULT: ${{ needs.npm-audit.result }}
          GO_RESULT: ${{ needs.go-vulncheck.result }}
          PYTHON_RESULT: ${{ needs.pip-audit.result }}
        run: |
          set -euo pipefail
          {
            echo "## Security audit summary"
            echo ""
            echo "| Ecosystem | Detected | Result |"
            echo "|---|---|---|"
            echo "| npm    | $NPM_DIRS    | $NPM_RESULT |"
            echo "| go     | $GO_DIRS     | $GO_RESULT |"
            echo "| python | $PYTHON_DIRS | $PYTHON_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Three-valued: a detected ecosystem must SUCCEED (skipped, cancelled
          # or timed out is not examined, never clean); an undetected one must
          # have been skipped; and detection itself must have succeeded.
          fail=0
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::ecosystem detection did not succeed ($DETECT_RESULT); nothing can be called clean"
            fail=1
          fi
          check() { # <ecosystem> <detected> <result>
            if [ "$2" = "true" ]; then
              if [ "$3" != "success" ]; then
                echo "::error::$1 was detected but its audit result is '$3'"
                fail=1
              fi
            elif [ "$3" != "skipped" ]; then
              echo "::error::$1 was not detected but its audit ran ('$3')"
              fail=1
            fi
          }
          check npm    "$HAS_NPM"    "$NPM_RESULT"
          check go     "$HAS_GO"     "$GO_RESULT"
          check python "$HAS_PYTHON" "$PYTHON_RESULT"
          if [ "$fail" -eq 1 ]; then
            echo "::error::the dependency audit is not clean. See the job logs."
            exit 1
          fi
