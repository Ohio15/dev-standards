name: Dependency Auto-Apply (Layer B)

# Layer B of the dev-standards dependency hygiene model.
# Weekly cron that auto-APPLIES safe dep fixes, runs tests, opens a PR with
# label `auto-apply` for human review. Auto-merge is NOT part of this layer
# (it can be added later as a thin opt-in wrapper).
#
# Privilege boundary: TWO JOBS (audit-dev-standards-2026-10-10 HIGH 2).
#   apply    contents: read, NO secrets. Runs everything that executes
#            dependency-controlled code: installs (lifecycle scripts), audit
#            fixes, builds and test suites. A malicious patch release inside a
#            semver range runs here and can rewrite anything in this job: its
#            files, $GITHUB_PATH, later steps, its outputs. So NOTHING it
#            produces is trusted. It hands over one artifact: a `git diff` of
#            the allow-listed manifests/lockfiles (ALLOWED_MANIFEST_RE below)
#            plus a result.json of per-ecosystem flags and notes.
#   publish  contents: write, pull-requests: write, the notification secrets.
#            Runs NO dependency code (no install, no build, no test, no setup-*
#            toolchain, nothing from the repo's node_modules). Fresh checkout of
#            the same commit; the artifact is read as DATA, never executed.
#            It validates result.json, applies the patch with `git apply
#            --index`, and fails closed unless every staged path matches the
#            allow-list, is a regular-file add/modify, and its content passes
#            the per-manifest checks (package.json may change only dependency
#            versions; new lockfile URLs only to hosts the lockfile already
#            used; go.mod gains no replace/exclude/retract; requirements stay
#            pinned). Then create-pull-request with add-paths = exactly those
#            files, then ntfy + shared-brain.
# Both jobs run on vars.CI_RUNNER when set: that runner (nexus-ci) is an
# ephemeral VM per job. A persistent runner would carry the apply job's
# compromise into publish and void this boundary; never point CI_RUNNER at one.
#
# Detection matches security-audit.yml (Layer A): every tracked manifest
# ANYWHERE in the tree (from `git ls-files`, never node_modules) selects an
# ecosystem, and each ecosystem step works through every manifest directory.
# A root-only check skipped every repo whose manifests live in a subdirectory.
#
# Per-ecosystem behaviour:
#   npm:    per lockfile root (a workspace member is fixed through its root's
#           lockfile). npm: `npm audit fix` (never --force). pnpm: `pnpm update`
#           of the packages `pnpm audit` names. Then the package's tests.
#   go:     `govulncheck` names the vulnerable modules; `go get -u=patch` each;
#           gated by go.sum churn heuristic (>20 lines = revert, likely breaking).
#   python: only requirements*.txt that are fully pinned (`==` or `~=`);
#           pip-audit --fix.
#   docker: only if every FROM line uses `@sha256:`; otherwise skipped + flagged.
#   gh-actions: scan `.github/workflows/*.yml` for `uses:` lines and flag
#           non-SHA-pinned ones (Dependabot owns SHA bumps).
#
# Every manifest directory ends in exactly one of three states:
#   examined  - the scanner ran; fixes (if any) applied, tests run.
#   declined  - policy will not auto-apply there (yarn, no lockfile, unpinned
#               requirements, pyproject.toml, go.sum churn, stdlib vulns).
#               Said in a ::warning::, the run summary and the PR body.
#   the step FAILS - a scanner or package manager could not examine it. The
#               job goes red and no PR is opened: unknown is never reported as
#               "no changes".
# A tracked file outside the allow-list that the apply job modified is never
# shipped; the PR body lists it as dropped.
#
# Outcomes:
#   anything bumped + tests pass/not run -> open PR labeled `auto-apply`
#   anything bumped + tests fail         -> open DRAFT PR labeled `auto-apply-broken`
#   nothing bumped                       -> notice + run summary, exit 0
#   a scanner could not run              -> apply fails; no PR; ntfy if configured
#   the patch fails validation           -> publish fails; no PR; ntfy if configured
#
# Notifications (publish job only):
#   ntfy: OFF unless the repo/org variable DEP_AUTO_APPLY_NTFY_URL is set
#   (full topic URL). If the secret DEP_AUTO_APPLY_NTFY_TOKEN is set it is
#   sent as a Bearer token. The post carries the repo name and PR URL, so
#   never point it at a public unauthenticated topic for a private repo.
#   shared-brain ingest on PR open (Bearer SHARED_BRAIN_TOKEN; gracefully
#   skipped if the secret isn't set).
#
# Enrollment: drop an empty `.github/auto-apply-enabled` file in the repo
# (per-repo opt-in). Kill switch: `rm .github/auto-apply-enabled` and push.
#
# Design ref: shared-brain decision 81b962de-3e94-4d67-9093-7dbb5644094d
# Critique:   shared-brain knowledge 7b258d5c-dcf4-49e9-973a-5e92b951a019

on:
  schedule:
    # Sundays 06:00 UTC. Pairs with the existing weekly hygiene cron at 05:00.
    - cron: "0 6 * * 0"
  workflow_dispatch:

# Nothing by default; each job declares exactly what it needs.
permissions: {}

concurrency:
  group: dep-auto-apply
  cancel-in-progress: false

env:
  # The only files the publish job will ever commit: exactly what the apply
  # job legitimately writes (npm audit fix / pnpm update: package.json and the
  # lockfile; go get + go mod tidy: go.mod, go.sum; pip-audit --fix: pinned
  # requirements*.txt). yarn.lock, pyproject.toml and Dockerfiles are never
  # modified by this workflow (declined or read-only), so they are not listed.
  # Repo-relative path; a node_modules component is refused separately.
  ALLOWED_MANIFEST_RE: '^(?:[A-Za-z0-9._@+-]+/)*(?:package\.json|package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|go\.mod|go\.sum|requirements[A-Za-z0-9._-]*\.txt)$'

jobs:
  apply:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Untrusted-code job: read-only token, no secrets.* anywhere in it.
    permissions:
      contents: read
    outputs:
      enrolled: ${{ steps.enroll.outputs.enrolled }}
      any_changed: ${{ steps.agg.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keeps the token out of .git/config (SC-13), nothing more: code that
          # runs in this job can still reach what the job itself holds. The
          # privilege boundary is the job split: this job's token is read-only
          # and it references no secrets; the write token and the secrets live
          # only in `publish`, which never runs dependency code.
          persist-credentials: false

      - name: Verify enrollment (.github/auto-apply-enabled present)
        id: enroll
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/auto-apply-enabled ]; then
            echo "::notice::This repo is not enrolled in Layer B (no .github/auto-apply-enabled file). Exiting silently."
            echo "enrolled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enrolled=true" >> "$GITHUB_OUTPUT"

      - name: Detect ecosystems
        if: steps.enroll.outputs.enrolled == 'true'
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          # Same detection as security-audit.yml: directories (repo-relative,
          # "." for the root) holding a tracked manifest, as a JSON array.
          # Filtered in python, not grep: under pipefail an empty grep exits 1.
          dirs_of() {
            git ls-files -z -- "$@" | python3 -c '
          import json, posixpath, sys
          paths = [p for p in sys.stdin.buffer.read().decode().split("\0") if p]
          # A control character (a newline above all) in a directory name could
          # forge a `::command::` line when a later step echoes it: refuse.
          hostile = [p for p in paths if any(ord(c) < 0x20 or ord(c) == 0x7f for c in p)]
          if hostile:
              sys.exit("control character in manifest path(s): " + ", ".join(repr(p) for p in hostile))
          keep = sorted({posixpath.dirname(p) or "." for p in paths
                         if "node_modules" not in p.split("/")})
          print(json.dumps(keep))'
          }
          npm_dirs=$(dirs_of 'package.json' '**/package.json')
          go_dirs=$(dirs_of 'go.mod' '**/go.mod')
          python_dirs=$(dirs_of 'pyproject.toml' '**/pyproject.toml' 'requirements*.txt' '**/requirements*.txt')
          count() { python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$1"; }
          first() { python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d[0] if d else "")' "$1"; }
          has_npm=false; [ "$(count "$npm_dirs")" -gt 0 ] && has_npm=true
          has_go=false; [ "$(count "$go_dirs")" -gt 0 ] && has_go=true
          has_python=false; [ "$(count "$python_dirs")" -gt 0 ] && has_python=true
          has_docker=false
          if [ -n "$(git ls-files -- 'Dockerfile' 'Dockerfile.*' '**/Dockerfile' '**/Dockerfile.*')" ]; then has_docker=true; fi
          has_actions=false
          if [ -n "$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')" ]; then has_actions=true; fi
          # setup-go needs one go.mod for the toolchain; GOTOOLCHAIN=auto
          # switches per module when another one asks for a newer Go.
          go_version_file=""
          if [ "$has_go" = "true" ]; then go_version_file="$(first "$go_dirs")/go.mod"; fi
          {
            echo "has_npm=$has_npm"; echo "has_go=$has_go"; echo "has_python=$has_python"
            echo "has_docker=$has_docker"; echo "has_actions=$has_actions"
            echo "npm_dirs=$npm_dirs"; echo "go_dirs=$go_dirs"; echo "python_dirs=$python_dirs"
            echo "go_version_file=$go_version_file"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::ecosystems: npm=$npm_dirs go=$go_dirs python=$python_dirs docker=$has_docker gh-actions=$has_actions"

      - name: Setup Node
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_npm == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '20'

      - name: Setup Go
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ steps.detect.outputs.go_version_file }}
          # No cache: its save runs after dependency code in this job, so the
          # module cache it would publish to the default-branch scope (restored
          # by every other workflow) is attacker-writable.
          cache: false

      - name: Setup Python
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # ---------------------------------------------------------------- npm
      - name: npm — audit fix + test
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_npm == 'true'
        id: npm
        shell: bash
        # Values reach the script through env, never `${{ }}` inside run:
        # an expression is pasted into the script before bash parses it.
        env:
          DIRS: ${{ steps.detect.outputs.npm_dirs }}
        run: |
          set -euo pipefail
          emit() { # <name> <value>: multi-line safe $GITHUB_OUTPUT write
            local delim
            delim="ghadelim_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          }
          decline() { notes+="declined $1"$'\n'; echo "::warning::npm auto-apply declined: $1"; }
          fail() { echo "::error::npm: $1"; exit 1; }
          lock_root() { # nearest directory at or above $1 holding a lockfile
            local d=$1 l
            while :; do
              for l in pnpm-lock.yaml yarn.lock package-lock.json npm-shrinkwrap.json; do
                if [ -f "$d/$l" ]; then printf '%s\n' "$d"; return 0; fi
              done
              [ "$d" = "." ] && return 1
              d=$(dirname "$d")
            done
          }
          tmp=$(mktemp -d)
          changed=false; notes=""; roots=(); changed_roots=()
          declare -A seen=()
          # Via a file, not process substitution: a failure there would be
          # invisible and leave nothing examined, reported as "no changes".
          python3 -c 'import json,os,sys; sys.stdout.buffer.write("".join(d + "\n" for d in json.loads(os.environ["DIRS"])).encode())' > "$tmp/dirs.txt" || fail "manifest directory list is unreadable"
          mapfile -t dirs < "$tmp/dirs.txt"
          for d in "${dirs[@]}"; do
            [ -n "$d" ] || continue
            if ! r=$(lock_root "$d"); then
              decline "$d: no lockfile, so a fix has nothing to pin into"
              continue
            fi
            # A workspace member is fixed through its root's lockfile.
            if [ -z "${seen[$r]+x}" ]; then seen[$r]=1; roots+=("$r"); fi
          done

          for r in "${roots[@]}"; do
            if [ -f "$r/pnpm-lock.yaml" ]; then
              corepack enable
              # Pinned fallback; a `packageManager` field in package.json
              # still wins under corepack. pnpm 11+ needs Node >= 22.13.
              corepack prepare pnpm@10.34.6 --activate
              (cd "$r" && pnpm install --frozen-lockfile) || fail "pnpm install failed in $r"
              rc=0
              (cd "$r" && pnpm audit --json) > "$tmp/audit.json" || rc=$?
              # pnpm audit exits 1 both for "vulnerabilities found" and for
              # "could not audit"; only the report's shape tells them apart.
              python3 - "$tmp/audit.json" "$rc" > "$tmp/vuln.txt" <<'PY' || fail "pnpm audit could not examine $r (exit $rc)"
          import json, sys
          rc = int(sys.argv[2])
          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except ValueError as exc:
              sys.exit(f"pnpm audit output is not JSON: {exc}")
          if rc not in (0, 1) or not isinstance(report, dict) or "error" in report or "advisories" not in report:
              sys.exit("pnpm audit produced no audit report")
          # Bytes, not print(): a CRLF on a Windows runner would end up in the name.
          sys.stdout.buffer.write("".join(n + "\n" for n in sorted({a["module_name"] for a in report["advisories"].values()})).encode())
          PY
              mapfile -t vuln < "$tmp/vuln.txt"
              if [ "${#vuln[@]}" -gt 0 ]; then
                # Within the declared ranges only (no --latest, so no majors).
                (cd "$r" && pnpm update "${vuln[@]}") || fail "pnpm update failed in $r"
              fi
            elif [ -f "$r/yarn.lock" ]; then
              decline "$r: yarn lockfile (yarn 4 has no safe 'audit fix' equivalent)"
              continue
            else
              (cd "$r" && npm ci) || fail "npm ci failed in $r"
              # --audit-level=none: vulnerabilities left unfixed (needing
              # --force) do not set the exit code, so non-zero is an error.
              (cd "$r" && npm audit fix --audit-level=none --json) > "$tmp/fix.json" \
                || fail "npm audit fix could not examine $r"
              python3 - "$tmp/fix.json" <<'PY' || fail "npm audit fix produced no audit report for $r"
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if "error" in report or not isinstance(report.get("audit"), dict) or "metadata" not in report["audit"]:
              sys.exit("no audit report in npm audit fix output")
          PY
            fi
            if ! git diff --quiet -- "$r"; then
              changed=true
              changed_roots+=("$r")
              notes+="bumped $r"$'\n'
            fi
          done

          # changed + notes are written BEFORE the tests run, so a test failure
          # still reaches the broken-PR path.
          emit changed "$changed"
          emit notes "$notes"

          tests=not_run; tests_failed=false
          for r in "${changed_roots[@]}"; do
            if ! python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1], encoding="utf-8")).get("scripts", {}).get("test") else 1)' "$r/package.json" 2>/dev/null; then
              continue
            fi
            [ "$tests" = "not_run" ] && tests=passed
            if [ -f "$r/pnpm-lock.yaml" ]; then
              (cd "$r" && pnpm test) || { tests=failed; tests_failed=true; }
            else
              (cd "$r" && npm test) || { tests=failed; tests_failed=true; }
            fi
          done
          emit tests "$tests"
          emit tests_failed "$tests_failed"

      # ----------------------------------------------------------------- go
      - name: Go — install govulncheck
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v govulncheck > /dev/null; then
            # Pinned, never @latest: a floating tool is unreviewed code. The pin
            # is chosen from the Go this job PROVISIONED (go.mod via setup-go,
            # under GOTOOLCHAIN=local), because each x/vuln release raises its go
            # directive: release v1.8.0 needs 1.26, v1.2.0-v1.7.0 need 1.25,
            # and release v1.1.4 needs 1.22 (verified from proxy.golang.org .mod files,
            # 2026-10-08). A single pin failed the fleet twice in one day: v1.8.0
            # on every 1.25 repo (Sentinel #107), then the pin to v1.7.0 on a 1.24
            # module (openclaw-1 #12). The vuln DB is fetched live from
            # vuln.go.dev, so an older binary does not weaken the scan. Add a row
            # when the fleet's floor moves; never fall through to @latest.
            gover="$(go env GOVERSION)"            # e.g. go1.25.14
            minor="$(printf '%s' "$gover" | sed -E 's/^go1\.([0-9]+).*$/\1/')"
            case "$minor" in
              ''|*[!0-9]*) echo "::error::cannot parse Go version '$gover' for the govulncheck pin table"; exit 1 ;;
            esac
            if   [ "$minor" -ge 26 ]; then vuln_pin=v1.8.0
            elif [ "$minor" -ge 25 ]; then vuln_pin=v1.7.0
            elif [ "$minor" -ge 22 ]; then vuln_pin=v1.1.4
            else echo "::error::no govulncheck pin for $gover (table floor is go1.22); raise the module's go directive"; exit 1
            fi
            echo "govulncheck pin for $gover: $vuln_pin"
            go install "golang.org/x/vuln/cmd/govulncheck@$vuln_pin"
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Go — govulncheck-driven bumps
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_go == 'true'
        id: go
        shell: bash
        env:
          DIRS: ${{ steps.detect.outputs.go_dirs }}
        run: |
          set -euo pipefail
          emit() {
            local delim
            delim="ghadelim_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          }
          decline() { notes+="declined $1"$'\n'; echo "::warning::go auto-apply declined: $1"; }
          fail() { echo "::error::go: $1"; exit 1; }
          tmp=$(mktemp -d)
          changed=false; notes=""; changed_dirs=()
          # Via a file, not process substitution: a failure there would be
          # invisible and leave nothing examined, reported as "no changes".
          python3 -c 'import json,os,sys; sys.stdout.buffer.write("".join(d + "\n" for d in json.loads(os.environ["DIRS"])).encode())' > "$tmp/dirs.txt" || fail "manifest directory list is unreadable"
          mapfile -t dirs < "$tmp/dirs.txt"
          for d in "${dirs[@]}"; do
            [ -n "$d" ] || continue
            # In -json mode govulncheck exits 0 whether or not it finds
            # anything; non-zero means it could not examine the module.
            (cd "$d" && govulncheck -json ./...) > "$tmp/gov.json" \
              || fail "govulncheck could not examine $d"
            python3 - "$tmp/gov.json" > "$tmp/mods.txt" <<'PY' || fail "govulncheck output for $d is unreadable"
          import json, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          dec, i, mods = json.JSONDecoder(), 0, set()
          while True:
              while i < len(text) and text[i].isspace():
                  i += 1
              if i >= len(text):
                  break
              frame, i = dec.raw_decode(text, i)
              trace = (frame.get("finding") or {}).get("trace") or []
              if trace and trace[0].get("module"):
                  mods.add(trace[0]["module"])
          sys.stdout.buffer.write("".join(m + "\n" for m in sorted(mods)).encode())
          PY
            mapfile -t mods < "$tmp/mods.txt"
            before_sum=$(wc -l < "$d/go.sum" 2>/dev/null || echo 0)
            go_sum_tracked=false
            if git ls-files --error-unmatch -- "$d/go.sum" > /dev/null 2>&1; then go_sum_tracked=true; fi
            for m in "${mods[@]}"; do
              [ -n "$m" ] || continue
              if [ "$m" = "stdlib" ] || [ "$m" = "toolchain" ]; then
                decline "$d: vulnerable Go standard library/toolchain; bump the Go version"
                continue
              fi
              echo "::notice::$d: go get -u=patch $m"
              (cd "$d" && go get -u=patch "$m") || fail "go get -u=patch $m failed in $d"
            done
            (cd "$d" && go mod tidy) || fail "go mod tidy failed in $d"

            after_sum=$(wc -l < "$d/go.sum" 2>/dev/null || echo 0)
            delta=$(( after_sum - before_sum ))
            delta=${delta#-}  # absolute value
            echo "$d: go.sum line delta: $delta"
            if [ "$delta" -gt 20 ]; then
              decline "$d: go.sum changed by $delta lines (>20, likely breaking); reverted"
              git checkout -- "$d/go.mod"
              if [ "$go_sum_tracked" = "true" ]; then git checkout -- "$d/go.sum"; else rm -f "$d/go.sum"; fi
              continue
            fi
            if ! git diff --quiet -- "$d/go.mod" "$d/go.sum"; then
              changed=true
              changed_dirs+=("$d")
              notes+="bumped $d"$'\n'
            fi
          done

          # Written BEFORE build/test, so a failure reaches the broken-PR path.
          emit changed "$changed"
          emit notes "$notes"

          tests=not_run; tests_failed=false
          for d in "${changed_dirs[@]}"; do
            [ "$tests" = "not_run" ] && tests=passed
            if ! (cd "$d" && go build ./...); then
              tests=failed; tests_failed=true; continue
            fi
            if [ -n "$(git ls-files -- "$d/*_test.go")" ]; then
              (cd "$d" && go test ./...) || { tests=failed; tests_failed=true; }
            fi
          done
          emit tests "$tests"
          emit tests_failed "$tests_failed"

      # ------------------------------------------------------------- python
      - name: Python — install pip-audit
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip==26.2.1
          # Pinned: a floating tool version is unreviewed code.
          python -m pip install pip-audit==2.10.1

      - name: Python — pip-audit --fix (pinned reqs only)
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_python == 'true'
        id: python
        shell: bash
        env:
          DIRS: ${{ steps.detect.outputs.python_dirs }}
        run: |
          set -euo pipefail
          emit() {
            local delim
            delim="ghadelim_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          }
          decline() { notes+="declined $1"$'\n'; echo "::warning::python auto-apply declined: $1"; }
          fail() { echo "::error::python: $1"; exit 1; }
          tmp=$(mktemp -d)
          changed=false; notes=""; changed_files=()
          # Via a file, not process substitution: a failure there would be
          # invisible and leave nothing examined, reported as "no changes".
          python -c 'import json,os,sys; sys.stdout.buffer.write("".join(d + "\n" for d in json.loads(os.environ["DIRS"])).encode())' > "$tmp/dirs.txt" || fail "manifest directory list is unreadable"
          mapfile -t dirs < "$tmp/dirs.txt"
          for d in "${dirs[@]}"; do
            [ -n "$d" ] || continue
            shopt -s nullglob
            files=("$d"/requirements*.txt)
            shopt -u nullglob
            if [ "${#files[@]}" -eq 0 ]; then
              decline "$d: pyproject.toml only (auto-apply covers pinned requirements*.txt)"
              continue
            fi
            for f in "${files[@]}"; do
              # Only auto-apply if every non-comment line is pinned with == or ~=.
              unpinned=$(grep -Ev '^\s*(#|$)' "$f" | grep -Ev '(==|~=)' || true)
              if [ -n "$unpinned" ]; then
                decline "$f: unpinned lines present"
                continue
              fi
              echo "----- pip-audit --fix --strict -r $f -----"
              rm -f "$tmp/pa.json"
              rc=0
              pip-audit --fix --strict -r "$f" --format json --output "$tmp/pa.json" || rc=$?
              # pip-audit exits 1 both when vulnerabilities remain and when it
              # could not audit; only a written report tells them apart.
              python - "$tmp/pa.json" "$rc" <<'PY' || fail "pip-audit could not examine $f (exit $rc)"
          import json, sys
          rc = int(sys.argv[2])
          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError) as exc:
              sys.exit(f"no pip-audit report: {exc}")
          if rc not in (0, 1) or not isinstance(report, dict) or "dependencies" not in report:
              sys.exit("pip-audit produced no audit report")
          PY
              if ! git diff --quiet -- "$f"; then
                changed=true
                changed_files+=("$f")
                notes+="bumped $f"$'\n'
              fi
            done
          done

          # Written BEFORE the tests, so a failure reaches the broken-PR path.
          emit changed "$changed"
          emit notes "$notes"

          tests=not_run; tests_failed=false
          if [ "${#changed_files[@]}" -gt 0 ]; then
            for f in "${changed_files[@]}"; do
              # Bumped pins that do not install are a broken change.
              python -m pip install -r "$f" || { tests=failed; tests_failed=true; }
            done
            if [ "$tests_failed" = "false" ] && python -c "import pytest" > /dev/null 2>&1; then
              rc=0
              python -m pytest || rc=$?
              # 5 = no tests collected: not run, not passed.
              case "$rc" in
                0) tests=passed ;;
                5) tests=not_run ;;
                *) tests=failed; tests_failed=true ;;
              esac
            fi
          fi
          emit tests "$tests"
          emit tests_failed "$tests_failed"

      # ------------------------------------------------------------- docker
      - name: Docker — note on FROM digest pinning
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_docker == 'true'
        id: docker
        shell: bash
        run: |
          set -euo pipefail
          emit() { # <name> <value>: multi-line safe $GITHUB_OUTPUT write
            local delim
            delim="ghadelim_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          }
          # We don't auto-bump base images: digest resolution requires
          # network access to the registry and a trusted source-of-truth for
          # "the new digest of the same tag". We only validate that every
          # FROM line is digest-pinned, and surface a warning if not.
          # Real newlines, never "\n" + printf %b: %b would also expand any
          # backslash sequence in a Dockerfile line.
          notes=""
          unpinned=""
          while IFS= read -r df; do
            while IFS= read -r line; do
              if [[ "$line" =~ ^[Ff][Rr][Oo][Mm][[:space:]] ]]; then
                if ! [[ "$line" =~ @sha256: ]]; then
                  unpinned+="${df}: ${line}"$'\n'
                fi
              fi
            done < "$df"
          done < <(git ls-files | grep -E '(^|/)Dockerfile(\..+)?$' || true)
          if [ -n "$unpinned" ]; then
            notes="Dockerfiles with un-digest-pinned FROM lines (auto-apply skipped):"$'\n'"${unpinned}"
            echo "::warning::Dockerfiles with un-digest-pinned FROM lines (auto-apply skipped):"
            printf '%s' "$unpinned"
          fi
          emit changed false
          emit notes "$notes"

      # ---------------------------------------------------------- gh-actions
      - name: GitHub Actions — flag non-SHA-pinned uses
        if: steps.enroll.outputs.enrolled == 'true' && steps.detect.outputs.has_actions == 'true'
        id: actions
        shell: bash
        run: |
          set -euo pipefail
          emit() { # <name> <value>: multi-line safe $GITHUB_OUTPUT write
            local delim
            delim="ghadelim_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          }
          # Auto-bumping SHA-pinned actions safely requires resolving the
          # latest SHA for the same major from the GitHub API for each one,
          # which is best done by Dependabot's own action-bump grouping
          # (install.sh seeds .github/dependabot.yml for it). We audit + warn.
          notes=""
          while IFS= read -r f; do
            while IFS= read -r line; do
              # match "uses: owner/repo@<ref>" — we want refs that aren't 40-char SHAs
              if [[ "$line" =~ uses:[[:space:]]+([A-Za-z0-9._/-]+)@([A-Za-z0-9._-]+) ]]; then
                ref="${BASH_REMATCH[2]}"
                action="${BASH_REMATCH[1]}"
                # local actions (./...) skip; reusable workflow paths skip.
                [[ "$action" == ./* || "$action" == .github/* ]] && continue
                if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                  notes+="${f}: ${action}@${ref} (not SHA-pinned)"$'\n'
                fi
              fi
            done < "$f"
          done < <(git ls-files .github/workflows/ | grep -E '\.(yml|yaml)$' || true)
          if [ -n "$notes" ]; then
            echo "::warning::Non-SHA-pinned GitHub Actions found (auto-apply skipped — fix manually):"
            printf '%s' "$notes"
          fi
          emit changed false
          emit notes "$notes"

      # ----------------------------------------------------------- aggregate
      - name: Aggregate result
        if: steps.enroll.outputs.enrolled == 'true'
        id: agg
        shell: bash
        env:
          NPM_CHANGED: ${{ steps.npm.outputs.changed }}
          GO_CHANGED: ${{ steps.go.outputs.changed }}
          PYTHON_CHANGED: ${{ steps.python.outputs.changed }}
          NPM_TESTS_FAILED: ${{ steps.npm.outputs.tests_failed }}
          GO_TESTS_FAILED: ${{ steps.go.outputs.tests_failed }}
          PYTHON_TESTS_FAILED: ${{ steps.python.outputs.tests_failed }}
          NPM_TESTS: ${{ steps.npm.outputs.tests }}
          GO_TESTS: ${{ steps.go.outputs.tests }}
          PYTHON_TESTS: ${{ steps.python.outputs.tests }}
          NPM_NOTES: ${{ steps.npm.outputs.notes }}
          GO_NOTES: ${{ steps.go.outputs.notes }}
          PYTHON_NOTES: ${{ steps.python.outputs.notes }}
        run: |
          set -euo pipefail
          any_changed=false
          tests_failed=false
          for c in "${NPM_CHANGED:-}" "${GO_CHANGED:-}" "${PYTHON_CHANGED:-}"; do
            if [ "$c" = "true" ]; then any_changed=true; fi
          done
          for t in "${NPM_TESTS_FAILED:-}" "${GO_TESTS_FAILED:-}" "${PYTHON_TESTS_FAILED:-}"; do
            if [ "$t" = "true" ]; then tests_failed=true; fi
          done
          # Tests only run after a change; a failure therefore always means
          # there is a change to put in front of a human.
          if [ "$tests_failed" = "true" ]; then any_changed=true; fi

          date_str=$(date -u +%Y-%m-%d)
          branch="auto-apply/${date_str}"

          {
            echo "any_changed=$any_changed"
            echo "tests_failed=$tests_failed"
            echo "date_str=$date_str"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          declined=$(printf '%s\n%s\n%s\n' "${NPM_NOTES:-}" "${GO_NOTES:-}" "${PYTHON_NOTES:-}" | grep -c '^declined ' || true)
          {
            echo "## Dependency auto-apply"
            echo ""
            echo "| Ecosystem | Changed | Tests |"
            echo "|---|---|---|"
            echo "| npm    | ${NPM_CHANGED:-not detected} | ${NPM_TESTS:-} |"
            echo "| go     | ${GO_CHANGED:-not detected} | ${GO_TESTS:-} |"
            echo "| python | ${PYTHON_CHANGED:-not detected} | ${PYTHON_TESTS:-} |"
            echo ""
            echo '```'
            printf '%s\n%s\n%s\n' "${NPM_NOTES:-}" "${GO_NOTES:-}" "${PYTHON_NOTES:-}" | grep -v '^$' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$any_changed" = "false" ]; then
            echo "::notice::No dependency changes this run; $declined manifest location(s) declined by policy (see the run summary)."
          fi

      # ------------------------------------------------------------ package
      # The hand-over to `publish`: a patch of the allow-listed files and the
      # per-ecosystem results, as an artifact. Everything here is untrusted by
      # construction (dependency code ran earlier in this job); `publish`
      # re-validates all of it and trusts none of it.
      - name: Package the allow-listed patch for the publish job
        if: steps.enroll.outputs.enrolled == 'true' && steps.agg.outputs.any_changed == 'true'
        id: package
        shell: bash
        env:
          ANY_CHANGED: ${{ steps.agg.outputs.any_changed }}
          TESTS_FAILED: ${{ steps.agg.outputs.tests_failed }}
          NPM_CHANGED: ${{ steps.npm.outputs.changed }}
          GO_CHANGED: ${{ steps.go.outputs.changed }}
          PYTHON_CHANGED: ${{ steps.python.outputs.changed }}
          NPM_TESTS: ${{ steps.npm.outputs.tests }}
          GO_TESTS: ${{ steps.go.outputs.tests }}
          PYTHON_TESTS: ${{ steps.python.outputs.tests }}
          NPM_NOTES: ${{ steps.npm.outputs.notes }}
          GO_NOTES: ${{ steps.go.outputs.notes }}
          PYTHON_NOTES: ${{ steps.python.outputs.notes }}
          DOCKER_NOTES: ${{ steps.docker.outputs.notes }}
          ACTIONS_NOTES: ${{ steps.actions.outputs.notes }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/dep-auto-apply"
          rm -rf "$out"
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          import json, os, re, subprocess, sys
          out = sys.argv[1]
          allowed = re.compile(os.environ["ALLOWED_MANIFEST_RE"])

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout

          def listed(raw):
              return [p for p in raw.decode("utf-8").split("\0") if p]

          def ok(path):
              return bool(allowed.fullmatch(path)) and "node_modules" not in path.split("/")

          # An allow-listed file that did not exist before (go.sum written by
          # go mod tidy) joins the diff as intent-to-add.
          new = [p for p in listed(git("ls-files", "--others", "--exclude-standard", "-z")) if ok(p)]
          if new:
              git("add", "--intent-to-add", "--", *[":(literal)" + p for p in new])
          changed = listed(git("diff", "--name-only", "-z", "--no-renames"))
          keep = sorted(p for p in changed if ok(p))
          dropped = sorted(p for p in changed if not ok(p))
          for p in dropped:
              print(f"::warning::auto-apply will not ship {p!r}: not an allow-listed manifest or lockfile")
          patch = git("diff", "--no-color", "--no-ext-diff", "--no-textconv", "--no-renames",
                      "--", *[":(literal)" + p for p in keep]) if keep else b""
          with open(os.path.join(out, "deps.patch"), "wb") as f:
              f.write(patch)
          env = os.environ.get
          result = {
              "schema": 1,
              "base_sha": git("rev-parse", "HEAD").decode().strip(),
              "any_changed": env("ANY_CHANGED", ""),
              "tests_failed": env("TESTS_FAILED", ""),
              "ecosystems": {
                  eco: {"changed": env(f"{eco.upper()}_CHANGED", ""),
                        "tests": env(f"{eco.upper()}_TESTS", ""),
                        "notes": env(f"{eco.upper()}_NOTES", "")}
                  for eco in ("npm", "go", "python")
              },
              "docker_notes": env("DOCKER_NOTES", ""),
              "actions_notes": env("ACTIONS_NOTES", ""),
              "dropped": dropped,
          }
          with open(os.path.join(out, "result.json"), "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)
          print(f"patch: {len(keep)} file(s), {len(patch)} bytes; dropped: {len(dropped)}")
          PY

      - name: Upload the patch for the publish job
        if: steps.enroll.outputs.enrolled == 'true' && steps.agg.outputs.any_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dep-auto-apply
          path: ${{ runner.temp }}/dep-auto-apply/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # ===================================================================
  # publish: the ONLY job with a write token or a secret. It runs no
  # dependency code. Do not add an install, build, test or setup-* step here;
  # scripts/tests/test_dep_auto_apply_workflow.py fails the build if you do.
  publish:
    needs: apply
    if: >-
      always() && needs.apply.outputs.enrolled == 'true'
      && (needs.apply.result == 'failure'
          || (needs.apply.result == 'success' && needs.apply.outputs.any_changed == 'true'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.apply.result == 'success'
        with:
          fetch-depth: 0
          # create-pull-request configures its own credential for the push.
          persist-credentials: false

      # Outside the workspace: the artifact is never part of the tree that
      # create-pull-request commits.
      - name: Download the apply job's patch (data, never executed)
        if: needs.apply.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dep-auto-apply
          path: ${{ runner.temp }}/dep-auto-apply

      - name: Verify the patch against the allow-list and apply it
        if: needs.apply.result == 'success'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # -I: isolated mode. No PYTHON* environment, no user site, and no
          # script/working directory on sys.path, so nothing in the checkout
          # can be imported in place of the standard library.
          python3 -I - <<'PY'
          import datetime, json, os, re, subprocess, sys
          from urllib.parse import urlsplit

          ALLOWED = re.compile(os.environ["ALLOWED_MANIFEST_RE"])
          ART = os.path.join(os.environ["RUNNER_TEMP"], "dep-auto-apply")
          MAX_PATCH = 64 * 1024 * 1024
          MAX_NOTES = 20000
          DEFAULT_HOSTS = {"registry.npmjs.org"}
          DEP_SECTIONS = ("dependencies", "devDependencies", "optionalDependencies", "peerDependencies")
          # A version range only: no URL, path, git, alias or workspace protocol.
          DEP_SPEC = re.compile(r"^[0-9A-Za-z.+^~<>=*| -]{1,128}$")
          GO_MOD_LINE = re.compile(
              r"^\s*(?:"
              r"|\)|require \(|go \d+(?:\.\d+){1,2}|toolchain go\d+(?:\.\d+){1,2}"
              r"|(?:require\s+)?[A-Za-z0-9._~/-]+ v[0-9A-Za-z.+-]+(?: // indirect)?"
              r")\s*$")
          GO_SUM_LINE = re.compile(r"^[A-Za-z0-9._~/-]+ v[0-9A-Za-z.+-]+(?:/go\.mod)? h1:[A-Za-z0-9+/]{43}=$")
          REQ_LINE = re.compile(
              r"^\s*(?:"
              r"|#.*"
              r"|[A-Za-z0-9][A-Za-z0-9._-]*(?:\[[A-Za-z0-9._,-]+\])?\s*(?:==|~=)\s*[A-Za-z0-9.*+!-]+"
              r"(?:\s*;[^#\\]*)?(?:\s+--hash=sha256:[0-9a-f]{64})*(?:\s*\\)?(?:\s+#.*)?"
              r"|--hash=sha256:[0-9a-f]{64}(?:\s*\\)?"
              r")\s*$")
          LOCK_LOCAL_REF = re.compile(r"(?:^|[\s'\"{,])(?:link|file|git\+[a-z]+|github|repo|commit|directory):")

          def clean(text):
              return re.sub(r"[\x00-\x1f\x7f]", "?", str(text))[:500]

          def die(msg):
              print(f"::error::publish refused the apply job's patch: {clean(msg)}")
              sys.exit(1)

          def git(*args, raw=False):
              p = subprocess.run(["git", *args], capture_output=True)
              if p.returncode != 0:
                  die(f"git {args[0]} failed: {p.stderr.decode('utf-8', 'replace').strip()}")
              return p.stdout if raw else p.stdout.decode("utf-8")

          def emit(name, value):
              delim = "ghadelim_" + os.urandom(12).hex()
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as f:
                  f.write(f"{name}<<{delim}\n{value}\n{delim}\n")

          # ---- result.json: shape and enums, nothing taken on trust --------
          try:
              with open(os.path.join(ART, "result.json"), "rb") as f:
                  raw_result = f.read(1024 * 1024 + 1)
          except OSError as exc:
              die(f"result.json unreadable: {exc}")
          if len(raw_result) > 1024 * 1024:
              die("result.json is larger than 1 MiB")
          try:
              result = json.loads(raw_result.decode("utf-8"))
          except ValueError as exc:
              die(f"result.json is not JSON: {exc}")
          bools = ("true", "false", "")
          tests_enum = ("passed", "failed", "not_run", "")
          try:
              assert isinstance(result, dict) and result.get("schema") == 1
              assert set(result) == {"schema", "base_sha", "any_changed", "tests_failed", "ecosystems",
                                     "docker_notes", "actions_notes", "dropped"}
              assert re.fullmatch(r"[0-9a-f]{40}", result["base_sha"])
              assert result["any_changed"] == "true" and result["tests_failed"] in ("true", "false")
              assert set(result["ecosystems"]) == {"npm", "go", "python"}
              for eco in result["ecosystems"].values():
                  assert set(eco) == {"changed", "tests", "notes"}
                  assert eco["changed"] in bools and eco["tests"] in tests_enum
                  assert isinstance(eco["notes"], str) and len(eco["notes"]) <= MAX_NOTES
              for key in ("docker_notes", "actions_notes"):
                  assert isinstance(result[key], str) and len(result[key]) <= MAX_NOTES
              assert isinstance(result["dropped"], list) and len(result["dropped"]) <= 500
              assert all(isinstance(p, str) and len(p) <= 4096 for p in result["dropped"])
          except (AssertionError, AttributeError, KeyError, TypeError):
              die("result.json does not have the expected shape")

          head = git("rev-parse", "HEAD").strip()
          if result["base_sha"] != head:
              die(f"patch was made against {result['base_sha']}, this checkout is {head}")

          # ---- the patch: apply to the index, then judge what is staged ----
          patch_path = os.path.join(ART, "deps.patch")
          try:
              size = os.path.getsize(patch_path)
          except OSError as exc:
              die(f"deps.patch missing: {exc}")
          if size > MAX_PATCH:
              die(f"deps.patch is {size} bytes (cap {MAX_PATCH})")
          if size == 0:
              die("apply reported a change but the patch of allow-listed files is empty")
          git("apply", "--index", "--whitespace=nowarn", "--", patch_path)

          entries = git("diff", "--cached", "--raw", "-z", "--no-renames", "--no-abbrev").split("\0")
          staged = []
          i = 0
          while i < len(entries) - 1:
              meta, path = entries[i], entries[i + 1]
              i += 2
              m = re.fullmatch(r":(\d{6}) (\d{6}) [0-9a-f]{40} [0-9a-f]{40} ([A-Z])", meta)
              if not m:
                  die(f"unexpected staged entry {meta!r}")
              old_mode, new_mode, status = m.groups()
              if not ALLOWED.fullmatch(path) or "node_modules" in path.split("/") or path.startswith("-"):
                  die(f"{path!r} is not an allow-listed manifest or lockfile")
              if status == "M":
                  if new_mode != old_mode or new_mode != "100644":
                      die(f"{path!r}: mode change or non-regular file ({old_mode} -> {new_mode})")
              elif status == "A":
                  # Only the Go tidy step legitimately creates a file (an untracked go.sum).
                  if new_mode != "100644" or path.rsplit("/", 1)[-1] != "go.sum":
                      die(f"{path!r}: a new file of this kind is never written by auto-apply")
              else:
                  die(f"{path!r}: status {status} (only modify, or add of go.sum, is allowed)")
              staged.append(path)
          if not staged:
              die("the patch staged nothing")

          def blob(spec):
              p = subprocess.run(["git", "show", spec], capture_output=True)
              return p.stdout.decode("utf-8") if p.returncode == 0 else None

          def added_lines(path):
              diff = git("diff", "--cached", "-U0", "--no-color", "--no-ext-diff", "--no-textconv",
                         "--", ":(literal)" + path)
              return [ln[1:] for ln in diff.splitlines() if ln.startswith("+") and not ln.startswith("+++")]

          def hosts(text):
              return {urlsplit(u).hostname for u in re.findall(r"[A-Za-z][A-Za-z0-9+.-]*://[^\s'\"<>,}]+", text or "")}

          def check_new_urls(path, old, lines):
              known = (hosts(old) | DEFAULT_HOSTS) - {None}
              for ln in lines:
                  for url in re.findall(r"[A-Za-z][A-Za-z0-9+.-]*://[^\s'\"<>,}]+", ln):
                      parts = urlsplit(url)
                      if parts.scheme != "https" or parts.hostname not in known:
                          die(f"{path}: new URL {url!r} (only https to a host the lockfile already used)")
                  if LOCK_LOCAL_REF.search(ln):
                      die(f"{path}: new local/git reference {ln.strip()!r}")

          for path in staged:
              name = path.rsplit("/", 1)[-1]
              old, new = blob(f"HEAD:{path}"), blob(f":{path}")
              if new is None:
                  die(f"{path}: staged content unreadable")
              # A line already present in the file is moved, not new (the Go
              # tidy step and lockfile writers reorder); only new lines are judged.
              existing = set((old or "").splitlines())
              lines = [ln for ln in added_lines(path) if ln not in existing]
              if name == "package.json":
                  try:
                      o, n = json.loads(old), json.loads(new)
                  except (TypeError, ValueError):
                      die(f"{path}: not valid JSON before and after")
                  if not isinstance(o, dict) or not isinstance(n, dict):
                      die(f"{path}: not a JSON object")
                  strip = lambda d: {k: v for k, v in d.items() if k not in DEP_SECTIONS}
                  if strip(o) != strip(n):
                      die(f"{path}: changes outside {', '.join(DEP_SECTIONS)} (scripts, config, ...)")
                  for sec in DEP_SECTIONS:
                      before, after = o.get(sec) or {}, n.get(sec) or {}
                      if not isinstance(after, dict):
                          die(f"{path}: {sec} is not an object")
                      for dep, spec in after.items():
                          if before.get(dep) != spec and not (isinstance(spec, str) and DEP_SPEC.match(spec)):
                              die(f"{path}: {sec}.{dep} = {spec!r} is not a version range")
              elif name in ("package-lock.json", "npm-shrinkwrap.json"):
                  try:
                      json.loads(new)
                  except ValueError:
                      die(f"{path}: not valid JSON")
                  check_new_urls(path, old, lines)
              elif name == "pnpm-lock.yaml":
                  check_new_urls(path, old, lines)
              elif name == "go.mod":
                  for ln in lines:
                      if not GO_MOD_LINE.match(ln):
                          die(f"{path}: line {ln.strip()!r} is not a require/go/toolchain line")
              elif name == "go.sum":
                  for ln in lines:
                      if not GO_SUM_LINE.match(ln):
                          die(f"{path}: line {ln.strip()!r} is not a go.sum hash line")
              else:  # requirements*.txt
                  for ln in lines:
                      if not REQ_LINE.match(ln):
                          die(f"{path}: line {ln.strip()!r} is not a pinned requirement")

          # ---- PR metadata: built here, from validated data only ------------
          def notes_block(text):
              text = re.sub(r"[\x00-\x08\x0b-\x1f\x7f]", "?", text)
              text = re.sub(r"[`~]{3,}", "''", text).strip()
              return "````text\n" + (text or "(none)") + "\n````"

          eco = result["ecosystems"]
          tests_failed = result["tests_failed"]
          date_str = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          table = ["| Ecosystem | Changed | Tests |", "|---|---|---|"]
          for e in ("npm", "go", "python"):
              table.append(f"| {e} | {eco[e]['changed'] or 'not detected'} | {eco[e]['tests'] or '-'} |")
          notes = "\n".join(n for n in (eco["npm"]["notes"], eco["go"]["notes"], eco["python"]["notes"]) if n.strip())
          files = "\n".join(f"- `{p}`" for p in staged)
          dropped = "\n".join(result["dropped"])
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          if tests_failed == "true":
              head_md = ("## Weekly auto-apply - TESTS FAILED\n\n"
                         "Layer B applied dependency bumps but the resulting test run failed. Marked draft so a\n"
                         "human can decide whether to:\n"
                         "- investigate + fix the test, then mark ready\n"
                         "- revert the bumps (close + delete branch)\n"
                         "- cherry-pick the safe subset\n")
          else:
              head_md = ("## Weekly auto-apply (Layer B)\n\n"
                         "Automated weekly bumps for safe (non-major) dependency fixes.\n")
          body = "\n".join([
              head_md,
              "### Per-ecosystem",
              *table,
              "",
              notes_block(notes),
              "",
              "**docker:**",
              notes_block(result["docker_notes"]),
              "**gh-actions:**",
              notes_block(result["actions_notes"]),
              "",
              "`tests=not_run` means no test suite was found: nothing was verified.",
              "",
              "### Files in this PR",
              "Each one matched the manifest allow-list and passed the publish job's content checks",
              "(package.json: dependency versions only; lockfiles: no new hosts or local/git references;",
              "go.mod: require/go/toolchain lines only; requirements: pinned lines only).",
              files,
              "",
              "### Not shipped (modified by the apply job, outside the allow-list)",
              notes_block(dropped),
              "",
              "### Reviewer checklist",
              "- [ ] Lockfile diff is present and reasonable",
              "- [ ] No major version bumps slipped through",
              "- [ ] CVE / GHSA list (if any) maps to the bumps",
              "- [ ] CI is green on this PR",
              "- [ ] Layer A `security-audit` workflow passes",
              "",
              f"Workflow run: {run_url}",
              "",
              "---",
              "Design: shared-brain decision `81b962de-3e94-4d67-9093-7dbb5644094d`",
              "Critique: shared-brain knowledge `7b258d5c-dcf4-49e9-973a-5e92b951a019`",
              "",
          ])
          body_path = os.path.join(os.environ["RUNNER_TEMP"], "dep-auto-apply-pr-body.md")
          with open(body_path, "w", encoding="utf-8", newline="\n") as f:
              f.write(body)

          emit("tests_failed", tests_failed)
          emit("date_str", date_str)
          emit("branch", f"auto-apply/{date_str}")
          emit("body_path", body_path)
          # Exactly the validated files, as literal pathspecs.
          emit("add_paths", "\n".join(":(literal)" + p for p in staged))
          print(f"verified {len(staged)} file(s): " + ", ".join(staged))
          PY

      # --------------------------------------------------------- compose PR
      - name: Open PR (success path)
        if: needs.apply.result == 'success' && steps.verify.outputs.tests_failed == 'false'
        id: pr_ok
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.verify.outputs.branch }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: ${{ steps.verify.outputs.add_paths }}
          commit-message: |
            chore: weekly auto-apply ${{ steps.verify.outputs.date_str }}

            Auto-applied by dep-auto-apply.yml (Layer B). Per-ecosystem notes
            and test results are in the PR body.
          title: "chore: weekly auto-apply ${{ steps.verify.outputs.date_str }}"
          body-path: ${{ steps.verify.outputs.body_path }}
          labels: |
            auto-apply
            dependencies
          delete-branch: true
          sign-commits: false

      - name: Open PR (broken path — tests failed)
        if: needs.apply.result == 'success' && steps.verify.outputs.tests_failed == 'true'
        id: pr_broken
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.verify.outputs.branch }}-broken
          base: ${{ github.event.repository.default_branch }}
          add-paths: ${{ steps.verify.outputs.add_paths }}
          commit-message: |
            chore(broken): weekly auto-apply ${{ steps.verify.outputs.date_str }} — tests failed

            Auto-applied by dep-auto-apply.yml (Layer B). Tests failed inside
            the workflow run; this PR is opened as a DRAFT for human triage.
          title: "chore(broken): weekly auto-apply ${{ steps.verify.outputs.date_str }} — tests failed"
          draft: true
          body-path: ${{ steps.verify.outputs.body_path }}
          labels: |
            auto-apply-broken
            dependencies
          delete-branch: false
          sign-commits: false

      # ------------------------------------------------------ notifications
      # Opt-in: the post names the repo and the PR, so it goes only to a
      # topic the repo owner configured (DEP_AUTO_APPLY_NTFY_URL), never to a
      # built-in public one.
      - name: Notify ntfy (PR opened, tests failed, or run failed)
        if: >-
          always() && vars.DEP_AUTO_APPLY_NTFY_URL != ''
          && (needs.apply.result == 'failure' || failure()
              || steps.pr_ok.outputs.pull-request-url || steps.pr_broken.outputs.pull-request-url)
        shell: bash
        env:
          NTFY_URL: ${{ vars.DEP_AUTO_APPLY_NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.DEP_AUTO_APPLY_NTFY_TOKEN }}
          APPLY_RESULT: ${{ needs.apply.result }}
          JOB_STATUS: ${{ job.status }}
          PR_OK_URL: ${{ steps.pr_ok.outputs.pull-request-url }}
          PR_BROKEN_URL: ${{ steps.pr_broken.outputs.pull-request-url }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$NTFY_URL" in
            https://*) ;;
            *) echo "::warning::DEP_AUTO_APPLY_NTFY_URL is not an https:// URL; not posting"; exit 0 ;;
          esac
          if [ "$APPLY_RESULT" = "failure" ]; then
            title="auto-apply FAILED: ${REPO}"
            body="Weekly auto-apply could not examine every ecosystem. Run: ${RUN_URL}"
            tags="rotating_light,auto-apply-failed"
            prio="urgent"
          elif [ "$JOB_STATUS" = "failure" ]; then
            title="auto-apply REFUSED: ${REPO}"
            body="The publish job refused or could not open the auto-apply PR (patch validation or PR step failed). Run: ${RUN_URL}"
            tags="rotating_light,auto-apply-failed"
            prio="urgent"
          elif [ -n "${PR_BROKEN_URL:-}" ]; then
            title="auto-apply BROKEN: ${REPO}"
            body="Tests failed on weekly auto-apply. Draft PR: ${PR_BROKEN_URL}"
            tags="warning,auto-apply-broken"
            prio="urgent"
          else
            title="auto-apply PR: ${REPO}"
            body="Weekly auto-apply opened a PR: ${PR_OK_URL}"
            tags="white_check_mark,auto-apply"
            prio="default"
          fi
          auth=()
          if [ -n "${NTFY_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer ${NTFY_TOKEN}"); fi
          curl -fsS -X POST \
            "${auth[@]}" \
            -H "Title: ${title}" \
            -H "Tags: ${tags}" \
            -H "Priority: ${prio}" \
            -d "${body}" \
            "$NTFY_URL" || \
            echo "::warning::ntfy publish failed (non-fatal)"

      - name: Brain ingest (PR opened only)
        if: steps.pr_ok.outputs.pull-request-url || steps.pr_broken.outputs.pull-request-url
        shell: bash
        env:
          BRAIN_TOKEN: ${{ secrets.SHARED_BRAIN_TOKEN }}
          PR_OK_URL: ${{ steps.pr_ok.outputs.pull-request-url }}
          PR_BROKEN_URL: ${{ steps.pr_broken.outputs.pull-request-url }}
          REPO: ${{ github.repository }}
          DATE_STR: ${{ steps.verify.outputs.date_str }}
        run: |
          set -euo pipefail
          if [ -z "${BRAIN_TOKEN:-}" ]; then
            echo "::notice::SHARED_BRAIN_TOKEN secret not set — skipping brain ingest"
            exit 0
          fi
          if [ -n "${PR_BROKEN_URL:-}" ]; then
            kind="auto-apply-broken"
            url="${PR_BROKEN_URL}"
          else
            kind="auto-apply"
            url="${PR_OK_URL}"
          fi
          payload=$(jq -nc \
            --arg c "${kind} PR opened on ${REPO} (${DATE_STR}): ${url}" \
            --arg p "dev-standards" \
            --arg t "$kind" \
            --arg s "github-actions:dep-auto-apply" \
            '{action:"ingest", content:$c, project:$p, source:$s, tags:[$t,"weekly","layer-b"]}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${BRAIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            https://shared-brain.us/api/memory/ingest || \
            echo "::warning::brain ingest failed (non-fatal)"
